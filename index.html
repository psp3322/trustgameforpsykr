/* =====================================================================
 * 화면 공통 조각
 * ===================================================================== */
const { h, render } = preact;
const { useState, useEffect, useRef, useMemo, useReducer } = preactHooks;
const html = htm.bind(h);
const COL = { green: '#3B8A57', red: '#CF4B3E', yellow: '#B98912', gray: '#8B847B', rust: '#C4573A', amber: '#C9822A', ink: '#1E1D1B', ink2: '#5E5852', ink3: '#9A938A', line: '#EAE4DA', line2: '#DDD5C9' };

function useStore(store) {
  const [, force] = useReducer((x) => x + 1, 0);
  useEffect(() => store.listen(force), [store]);
  return store;
}
function useNow(ms = 250) {
  const [t, setT] = useState(now());
  useEffect(() => {
    const id = setInterval(() => setT(now()), ms);
    return () => clearInterval(id);
  }, [ms]);
  return t;
}
function useNetStatus(net) {
  const [st, setSt] = useState({});
  useEffect(() => net.onStatus(setSt), [net]);
  return st;
}
function useCountUp(target, ms = 900, key) {
  const [v, setV] = useState(0);
  useEffect(() => {
    let raf;
    const t0 = performance.now();
    const step = (t) => {
      const k = Math.min(1, (t - t0) / ms);
      const e = 1 - Math.pow(1 - k, 3);
      setV(target * e);
      if (k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, key]);
  return v;
}

function Kicker({ children }) {
  return html`<div class="kicker"><span class="kdot"></span>${children}</div>`;
}

function qrSvg(text) {
  const q = qrcode(0, 'M');
  q.addData(text);
  q.make();
  return q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
}
function QR({ text, size }) {
  const svg = useMemo(() => qrSvg(text), [text]);
  return html`<div class="qr" style=${{ width: size, height: size }} dangerouslySetInnerHTML=${{ __html: svg }}></div>`;
}
function downloadQRPng(text, filename = 'trust-game-qr.png') {
  const q = qrcode(0, 'M');
  q.addData(text);
  q.make();
  const n = q.getModuleCount();
  const margin = 4;
  const px = Math.floor(1200 / (n + margin * 2));
  const size = px * (n + margin * 2);
  const c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, size, size);
  g.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (q.isDark(r, col)) g.fillRect((col + margin) * px, (r + margin) * px, px, px);
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function downloadText(text, filename, type = 'text/csv;charset=utf-8') {
  const blob = new Blob([text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function Ring({ left, total, size = 64, stroke = 7 }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const frac = total > 0 ? clamp(left / total, 0, 1) : 0;
  const sec = Math.ceil(left / 1000);
  const col = sec <= 5 ? COL.red : COL.rust;
  return html`<div class="ring" style=${{ width: size, height: size }}>
    <svg width=${size} height=${size}>
      <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke=${COL.line} stroke-width=${stroke} />
      <circle cx=${size / 2} cy=${size / 2} r=${r} fill="none" stroke=${col} stroke-width=${stroke} stroke-linecap="round"
        stroke-dasharray=${c} stroke-dashoffset=${c * (1 - frac)} style=${{ transition: 'stroke-dashoffset .25s linear' }} />
    </svg>
    <span class="t num" style=${{ color: sec <= 5 ? COL.red : COL.ink, fontSize: Math.round(size * 0.3) + 'px' }}>${sec}</span>
  </div>`;
}

// 간단한 선 그래프 (0~1 비율)
function LineChart({ series, xLabels, divider, dividerLabel, height = 220, width = 640, yLabel }) {
  const pad = { l: 46, r: 16, t: 34, b: 34 };
  const W = width, H = height;
  const n = xLabels.length;
  const x = (i) => pad.l + (n <= 1 ? (W - pad.l - pad.r) / 2 : (i * (W - pad.l - pad.r)) / (n - 1));
  const y = (v) => pad.t + (1 - clamp(v, 0, 1)) * (H - pad.t - pad.b);
  return html`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">
    ${[0, 0.5, 1].map((g) => html`<g>
      <line x1=${pad.l} x2=${W - pad.r} y1=${y(g)} y2=${y(g)} stroke=${COL.line} stroke-width="1" />
      <text x=${pad.l - 8} y=${y(g) + 4} text-anchor="end" font-size="12" fill=${COL.ink3}>${Math.round(g * 100)}%</text>
    </g>`)}
    ${divider !== undefined && divider > 0 && divider < n ? html`<g>
      <line x1=${(x(divider - 1) + x(divider)) / 2} x2=${(x(divider - 1) + x(divider)) / 2} y1="20" y2=${H - pad.b} stroke=${COL.ink3} stroke-dasharray="4 4" />
      ${dividerLabel ? html`<text x=${(x(divider - 1) + x(divider)) / 2} y="14" text-anchor="middle" font-size="13" font-weight="700" fill=${COL.ink2}>${dividerLabel}</text>` : null}
    </g>` : null}
    ${xLabels.map((lab, i) => html`<text x=${x(i)} y=${H - 10} text-anchor="middle" font-size="12" fill=${COL.ink2}>${lab}</text>`)}
    ${series.map((s) => {
      const pts = s.pts.map((v, i) => (v === null || v === undefined ? null : [x(i + (s.offset || 0)), y(v)])).filter(Boolean);
      if (!pts.length) return null;
      const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      return html`<g>
        <path d=${d} fill="none" stroke=${s.color} stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
        ${pts.map((p) => html`<circle cx=${p[0]} cy=${p[1]} r="5" fill="#fff" stroke=${s.color} stroke-width="3" />`)}
      </g>`;
    })}
    ${yLabel ? html`<text x="4" y="10" font-size="11" fill=${COL.ink3}>${yLabel}</text>` : null}
  </svg></div>`;
}

function fireConfetti(ms = 3200) {
  const c = document.createElement('canvas');
  c.className = 'confetti';
  document.body.appendChild(c);
  const g = c.getContext('2d');
  const resize = () => { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; };
  resize();
  const cols = ['#C4573A', '#3B8A57', '#B98912', '#E9A27E', '#1E1D1B', '#CF4B3E'];
  const parts = range(160).map(() => ({
    x: Math.random() * c.width, y: -Math.random() * c.height * 0.5,
    vx: (Math.random() - 0.5) * 3 * devicePixelRatio, vy: (2 + Math.random() * 4) * devicePixelRatio,
    s: (5 + Math.random() * 7) * devicePixelRatio, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
    col: cols[Math.floor(Math.random() * cols.length)],
  }));
  const t0 = performance.now();
  const step = (t) => {
    g.clearRect(0, 0, c.width, c.height);
    parts.forEach((p) => {
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vy += 0.03 * devicePixelRatio;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.col; g.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66); g.restore();
    });
    if (t - t0 < ms) requestAnimationFrame(step);
    else c.remove();
  };
  requestAnimationFrame(step);
}

const CHOICE = {
  C: { emoji: '🤝', label: '협력', tone: 'green' },
  D: { emoji: '😈', label: '배신', tone: 'red' },
};
function outcomeInfo(mine, theirs) {
  if (mine === 'C' && theirs === 'C') return { emoji: '🤝', title: '둘 다 협력!', tone: 'green' };
  if (mine === 'C' && theirs === 'D') return { emoji: '😵', title: '당했다…', tone: 'red' };
  if (mine === 'D' && theirs === 'C') return { emoji: '😎', title: '배신 성공', tone: 'amber' };
  return { emoji: '💀', title: '둘 다 배신', tone: 'gray' };
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen && document.exitFullscreen();
}
const ringPx = () => clamp(Math.round(innerWidth * 0.045), 56, 110);

function HostApp({ host, net }) {
  useStore(host);
  const S = host.S;
  const ui = host.ui;
  const url = useMemo(() => joinUrl(host.params), []);
  useEffect(() => {
    const onKey = (e) => {
      if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      if (host.resumePrompt) return;
      if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'PageDown') {
        e.preventDefault();
        if (!host.ui.settings && !host.ui.qr) host.primary();
      } else if (e.key === 'q' || e.key === 'Q') host.setUI({ qr: !host.ui.qr });
      else if (e.key === 's' || e.key === 'S') host.setUI({ settings: !host.ui.settings });
      else if (e.key === 'p' || e.key === 'P') host.togglePause();
      else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      else if (e.key === 'Escape') host.setUI({ qr: false, settings: false });
    };
    addEventListener('keydown', onKey);
    return () => removeEventListener('keydown', onKey);
  }, []);
  if (!S) return html`<div class="boot">불러오는 중…</div>`;
  let main = null;
  if (S.stage === 'lobby') main = html`<${HostLobby} host=${host} url=${url} />`;
  else if (S.stage === 'pd') main = html`<${HostPD} host=${host} />`;
  else if (S.stage === 'bots') main = html`<${HostBots} host=${host} />`;
  else if (S.stage === 'pgg') main = html`<${HostPGG} host=${host} />`;
  else if (S.stage === 'final') main = html`<${HostFinal} host=${host} />`;
  return html`<div class="host">
    <${HostTop} host=${host} net=${net} />
    <main class="hmain">${main}</main>
    <${ControlBar} host=${host} />
    ${ui.qr ? html`<${QROverlay} host=${host} url=${url} />` : null}
    ${ui.settings ? html`<${SettingsModal} host=${host} url=${url} />` : null}
    ${host.resumePrompt ? html`<${ResumePrompt} host=${host} />` : null}
    ${host.passive ? html`<div class="overlay"><div class="card resume">
      <h3>다른 화면에서 이미 진행 중이에요</h3>
      <p style=${{ margin: 0 }}>같은 방을 다른 탭이나 기기에서 이미 진행 중이라, 학생 폰이 헷갈리지 않게 이 화면은 멈췄어요.</p>
      <p class="muted" style=${{ margin: 0 }}>다른 화면을 닫고 여기서 계속하려면 아래 버튼을 누르세요. 이 화면 기록으로 이어 가요.</p>
      <div class="btnrow"><button class="hbtn primary" onClick=${() => host.takeover()}>이 화면에서 진행하기</button></div>
    </div></div>` : null}
    ${ui.toast ? html`<div class="toast" key=${ui.toast.at}>${ui.toast.msg}</div>` : null}
  </div>`;
}

function PDRound({ host }) {
  const S = host.S;
  const pd = S.pd;
  const part = host.pdPart();
  const r = pd.round;
  const t = useNow(250);
  const revealed = pd.phase === 'reveal';
  const pending = host.pdPending();
  const humans = part.members.filter((p) => S.players[p] && !S.players[p].kicked);
  const doneN = humans.length - pending.length;
  const tagMode = part.k === 1 && part.mode === 'stranger' ? '매 판 새 상대' : '같은 상대';
  const coopN = revealed ? part.outcomes[r].reduce((s, o) => s + (o.a !== BOT && o.ca === 'C' ? 1 : 0) + (o.b !== BOT && o.cb === 'C' ? 1 : 0), 0) : 0;
  return html`<div class="stack">
    <div class="hrow">
      <div>
        <${Kicker}>1막 · 대결 1 · ${part.k === 1 ? '1차' : '2차'} · ${tagMode}<//>
        <h1 class="h-title sm">라운드 <span class="num">${r + 1} / ${part.rounds}</span></h1>
      </div>
      <div style=${{ display: 'flex', alignItems: 'center', gap: '1em' }}>
        ${revealed
          ? html`<div class="progress-big num anim-pop" key=${'c' + r}>${coopN}/${humans.length}<small>협력</small></div>`
          : html`<div class="progress-big num">${doneN}/${humans.length}<small>골랐어요</small></div>`}
        ${!revealed && pd.deadline ? html`<${Ring} left=${Math.max(0, pd.deadline - t)} total=${S.settings.pdTimer * 1000} size=${ringPx()} />` : null}
      </div>
    </div>
    <div class="pairs">${part.schedule[r].map((pair, i) => html`<${PairCard} key=${part.k + '-' + r + '-' + i} host=${host} part=${part} pair=${pair} idx=${i} r=${r} revealed=${revealed} />`)}</div>
    ${revealed ? html`<div class="statline anim-fade"><span>이번 판 협력률</span><div class="meter"><i style=${{ width: pct(part.coop[r]) }}></i></div><span class="num">${pct(part.coop[r])}</span></div>` : null}
  </div>`;
}

function PairCard({ host, part, pair, idx, r, revealed }) {
  const S = host.S;
  const [a, b] = pair;
  const ch = part.choices[r] || {};
  const o = revealed ? part.outcomes[r].find((x) => x.a === a && x.b === b) : null;
  let tone = '', label = '';
  if (o) {
    if (o.ca === 'C' && o.cb === 'C') { tone = 'green'; label = '🤝 둘 다 협력'; }
    else if (o.ca === 'D' && o.cb === 'D') { tone = 'gray'; label = '💀 둘 다 배신'; }
    else { tone = 'amber'; label = '⚡ 엇갈림'; }
  }
  const seat = (pid, choice) => {
    const isBot = pid === BOT;
    const p = S.players[pid];
    const named = part.named;
    const showFace = named || (isBot && revealed);
    const chosen = isBot || pid in ch; // 알고리즘 자리는 바로 고른 것으로 보여 줘서 '누가 늦나' 오해가 없게
    const face = showFace ? (isBot ? '🤖' : p ? p.avatar : '🙂') : '?';
    const nm = named ? (isBot ? '알고리즘' : p ? p.name : '?') : revealed && isBot ? '알고리즘' : '익명';
    return html`<div class="seat">
      <div class="face ${showFace ? '' : 'q'} ${!revealed && chosen ? 'done' : ''}">${face}${!revealed && chosen ? html`<span class="ok">✓</span>` : null}</div>
      <div class="nm">${nm}</div>
      ${revealed && !named && choice ? html`<div class="chosen tone-${CHOICE[choice].tone}">${CHOICE[choice].emoji} ${CHOICE[choice].label}</div>` : null}
    </div>`;
  };
  return html`<div class="pair card ${o ? 'revealed anim-flip tone-' + tone : ''}">
    <div class="tag">짝 ${idx + 1}</div>
    <div class="seats">${seat(a, o && o.ca)}<div class="vs">VS</div>${seat(b, o && o.cb)}</div>
    <div class="label" style=${o ? null : { visibility: 'hidden' }}>${label || '·'}</div>
  </div>`;
}

  const p1 = host.S.pd.parts[1];
  const xl = [...st.series1.map((_, i) => `1차 ${i + 1}`), ...st.series2.map((_, i) => `2차 ${i + 1}`)];
  return html`<div class="stack anim-fade">
    <${Kicker}>1막 · 대결 1 · 결과<//>
    <h1 class="headline">${head}</h1>

      <div class="card cbox"><h4>판 평균 협력률</h4>
        <${HBars} rows=${[
          { label: html`<b>1차</b><br />${p1 && p1.mode === 'stranger' ? '매 판 새 상대' : '같은 상대'}`, value: r1v, tone: 'gray' },
          { label: html`<b>2차</b><br />같은 상대${host.S.pd.parts[2] && host.S.pd.parts[2].named ? ' · 이름 공개' : ''}`, value: r2v, tone: 'green' },
        ]} />
        ${r1v !== null && r2v !== null ? html`<div class="delta num ${d > 0.005 ? 'up' : d < -0.005 ? 'down' : ''}">${d > 0.005 ? '▲' : d < -0.005 ? '▼' : '＝'} ${Math.abs(Math.round(d * 100))}%p</div>` : null}
      </div>
      <div class="card cbox"><h4>판별 협력률</h4>

    : play ? '📱 각자 속도대로 진행해요. 세 알고리즘과 다 붙고 나면 정체도 맞혀 봐요.' : '하나씩 열어 볼게요. 누가 맞혔을까요?';

        <span>${p && p.guess ? '✅' : p && p.a >= 3 ? '🤔' : ''}</span>
      </div>`;
    })}</div>

function Tourney() {
  const keys = ['AllD', 'AllC', 'TFT'];
  const res = useMemo(() => tournament(keys, 10), []);
  const [step, setStep] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setStep((s) => (s < res.games.length ? s + 1 : s)), 900);
    return () => clearInterval(id);
  }, []);
  const totals = { AllD: 0, AllC: 0, TFT: 0 };
  res.games.slice(0, step).forEach((g) => {
    totals[g.a] += g.sa;
    if (!g.self) totals[g.b] += g.sb;
  });
  const done = step >= res.games.length;
  const max = Math.max(...Object.values(res.totals));
  const winner = Object.entries(res.totals).sort((x, y) => y[1] - x[1])[0][0];
  const A = (k) => ALGOS.find((al) => al.key === k);
  return html`<div class="stack">
    <${Kicker}>Axelrod (1980) 토너먼트 따라 해보기<//>
    <h1 class="h-title sm">셋이 서로 <em>10판씩</em> 붙으면?</h1>
    <p class="h-sub">자기 자신과도 한 번씩 붙어요. 점수는 오늘 쓴 보상표 그대로예요.</p>
    <div class="tourney">
      <div class="card cbox">
        <h4>${done ? html`🏆 <span style=${{ color: COL.rust }}>${A(winner).name}</span> 우승` : '누적 점수'}</h4>
        <div class="hbars">${keys.map((k, i) => html`<div class="hbar-row tone-${A(k).tone}">
          <div class="lab"><b>${A(k).emoji} ${A(k).name}</b></div>
          <div class="track"><div class="fill" style=${{ width: (Math.max(0, totals[k]) / max) * 100 + '%', transition: 'width .6s ease', animation: 'none' }}></div></div>
          <div class="val num">${nf(totals[k])}</div>
        </div>`)}</div>
        ${done ? html`<p class="h-sub anim-fade" style=${{ fontSize: '.95em', marginTop: '1.2em' }}>착하기만 해도 지고, 못되기만 해도 져요. 먼저 손 내밀고 받은 만큼 돌려주는 쪽이 이겼어요.</p>` : null}
      </div>
      <div class="card cbox"><h4>경기 결과 (${Math.min(step, res.games.length)}/${res.games.length})</h4>
        <div class="games">${res.games.slice(0, step).map((g, i) => html`<div class="game on" key=${i}>
          <span>${A(g.a).emoji} vs ${A(g.b).emoji}${g.self ? ' (자기 자신)' : ''}</span>
          <span class="num">${g.self ? nf(g.sa) : `${nf(g.sa)} : ${nf(g.sb)}`}</span>
        </div>`)}</div>
      </div>
    </div>
  </div>`;
}

function Echo() {
  const plain = useMemo(() => echoDemo(false), []);
  const gen = useMemo(() => echoDemo(true), []);
  const [step, setStep] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setStep((s) => Math.min(10, s + 1)), 700);
    return () => clearInterval(id);
  }, []);
  const lane = (title, sub, data, tone) => html`<div class="card lane">
    <h4><span>${title} <span class="muted" style=${{ fontWeight: 600 }}>${sub}</span></span>${step >= 10 ? html`<span class="num anim-pop" style=${{ color: tone }}>합계 ${data.sa} : ${data.sb}</span>` : null}</h4>
    ${['A', 'B'].map((side) => html`<div class="moves" style=${{ marginBottom: '.35em' }}>
      <span class="mvlab">${side === 'A' ? '왼쪽' : '오른쪽'}</span>
      ${data[side].map((m, i) => html`<div class="mv ${m.m} ${i >= step ? 'hide' : 'anim-pop'}">
        ${m.mark ? html`<span class="mk">${m.mark === 'err' ? '⚡' : '🕊️'}</span>` : null}${m.m === 'C' ? '협' : '배'}
      </div>`)}
    </div>`)}
  </div>`;
  return html`<div class="stack">
    <${Kicker}>관대한 팃포탯 · Nowak & Sigmund (1992)<//>
    <h1 class="h-title sm">그런데 <em>실수</em>가 한 번 끼면?</h1>
    <p class="h-sub">3판째에 왼쪽이 실수로 배신(⚡)해요. 그다음은 서로 따라 하기만 해요.</p>
    ${lane('팃포탯 vs 팃포탯', '받은 대로 그대로', plain, COL.red)}
    ${lane('관대한 팃포탯 vs 관대한 팃포탯', '가끔은 한 번 봐줌(🕊️)', gen, COL.green)}
    ${step >= 10 ? html`<p class="h-sub anim-fade" style=${{ marginTop: '.4em' }}>실수 한 번이 끝없는 보복으로 번져요. 한 번 봐주면 다시 협력으로 돌아와요.</p>` : null}
  </div>`;
}

/* ---------- 공공재 게임 ---------- */
function Gauge({ host, compact }) {
  const st = host.pggStats();
  const target = host.S.settings.jellyTarget / 100;
  const v = st ? st.gauge : 0;
  return html`<div class="card gauge" style=${compact ? { minWidth: '14em' } : null}>
    <div class="gt"><span>🎁 서프라이즈 게이지</span><span class="num">${pct(v)}</span></div>
    <div class="gtrack">
      <div class="gfill" style=${{ width: pct(v) }}></div>
      <div class="gmark" style=${{ left: pct(target) }}><span>목표 ${pct(target)}</span></div>
    </div>
  </div>`;
}

function Masks({ host, done }) {
  const G = host.S.pgg;
  const R = host.pggRound();
  const members = R ? R.members : host.activePids();
  const list = members.filter((pid) => G.alias[pid] !== undefined).map((pid) => ({ a: G.alias[pid], ok: done ? done.includes(pid) : false }));
  list.sort((x, y) => x.a - y.a);
  return html`<div class="masks ${done ? 'big' : ''}">${list.map((m) => html`<div class="mask ${done ? (m.ok ? 'done' : 'wait') : ''}" key=${m.a} title=${ANIMALS[m.a][1]}>${ANIMALS[m.a][0]}${m.ok ? html`<span class="ok">✓</span>` : null}</div>`)}</div>`;
}

function HostPGG({ host }) {
  const G = host.S.pgg;
  const S = host.S;
  const s = S.settings;
  const t = useNow(250);
  const partTag = G.part === 'A' ? 'A단계 · 처벌 없음' : 'B단계 · 응징 가능';
  if (G.phase === 'intro') {
    return html`<div class="stack anim-fade">
      <div class="hrow">
        <div><${Kicker}>3막 · 공공재 게임 · Fehr & Gächter (2002) 따라 하기<//>
          <h1 class="h-title">다 같이 넣으면, <em>다 같이 이득?</em></h1></div>
        <${Gauge} host=${host} compact=${true} />
      </div>
      <div class="rules">
        <div class="card rule"><div class="ic">🪙</div><div class="t">매 판 코인 ${s.pggEndow}개</div><div class="d">판마다 새로 받아요.</div></div>
        <div class="card rule"><div class="ic">🏦</div><div class="t">금고에 넣고 싶은 만큼</div><div class="d">0개부터 ${s.pggEndow}개까지. 안 넣은 건 내 거예요.</div></div>
        <div class="card rule"><div class="ic">✖️</div><div class="t">금고는 ${s.pggMult}배로</div><div class="d">모인 코인이 ${s.pggMult}배로 불어나요.</div></div>
        <div class="card rule"><div class="ic">🍰</div><div class="t">모두 똑같이 나눠요</div><div class="d">안 넣은 사람도 똑같이 받아요.</div></div>
      </div>
      <p class="h-sub" style=${{ marginTop: '.6em' }}>🎭 이번엔 동물 가면을 써요. 누가 누군지 아무도 몰라요.</p>
      <${Masks} host=${host} />
    </div>`;
  }
  if (G.phase === 'introB') {
    return html`<div class="stack anim-fade">
      <div class="hrow">
        <div><${Kicker}>3막 · 공공재 게임 · B단계<//>
          <h1 class="h-title">이번엔 <em>응징 버튼</em>이 생겨요 👊</h1></div>
        <${Gauge} host=${host} compact=${true} />
      </div>
      <p class="h-sub">금고 결과를 보고 나서, 내 코인을 써서 다른 동물의 코인을 깎을 수 있어요.</p>
      <div class="rules">
        <div class="card rule"><div class="ic">👊</div><div class="t">1개 쓰면 내 코인 −1</div><div class="d">응징에도 비용이 들어요.</div></div>
        <div class="card rule"><div class="ic">💥</div><div class="t">맞은 쪽은 −${s.pggImpact}</div><div class="d">한 개당 상대 코인 ${s.pggImpact}개가 깎여요.</div></div>
        <div class="card rule"><div class="ic">✋</div><div class="t">한 판에 최대 ${s.pggMaxPunish}개</div><div class="d">여러 동물에게 나눠 써도 돼요.</div></div>
        <div class="card rule"><div class="ic">🙆</div><div class="t">안 써도 괜찮아요</div><div class="d">그냥 넘어가도 돼요.</div></div>
      </div>
      <${Masks} host=${host} />
    </div>`;
  }
  if (G.phase === 'contrib' || G.phase === 'punish') {
    const R = host.pggRound();
    const pending = G.phase === 'contrib' ? host.pggPendingContrib() : host.pggPendingPunish();
    const done = R.members.filter((p) => !pending.includes(p));
    const total = (G.phase === 'contrib' ? s.pggTimer : s.pggTimer) * 1000;
    return html`<div class="stack">
      <div class="hrow">
        <div><${Kicker}>3막 · 공공재 게임 · ${partTag}<//>
          <h1 class="h-title sm">${G.phase === 'contrib' ? html`라운드 <span class="num">${G.round + 1} / ${host.pggLimit()}</span>` : html`<em>응징 시간</em> 👊`}</h1>
          <p class="h-sub">${G.phase === 'contrib' ? '📱 금고에 몇 개 넣을지 골라 주세요.' : '📱 응징할 동물이 있나요? 안 해도 돼요.'}</p></div>
        <div style=${{ display: 'flex', alignItems: 'center', gap: '1em' }}>
          <div class="progress-big num">${done.length}/${R.members.length}<small>${G.phase === 'contrib' ? '냈어요' : '정했어요'}</small></div>
          ${G.deadline ? html`<${Ring} left=${Math.max(0, G.deadline - t)} total=${total} size=${ringPx()} />` : null}
        </div>
      </div>
      <${Masks} host=${host} done=${done} />
      <div style=${{ marginTop: '1.4em', maxWidth: '30em' }}><${Gauge} host=${host} /></div>
    </div>`;
  }
  if (G.phase === 'creveal') return html`<${PGGContribReveal} host=${host} key=${'cr' + G.rounds.length} />`;
  if (G.phase === 'preveal') return html`<${PGGPunishReveal} host=${host} key=${'pr' + G.rounds.length} />`;
  if (G.phase === 'end') return html`<${PGGEnd} host=${host} key=${'end' + G.part} />`;
  if (G.phase === 'surprise') return html`<${PGGSurprise} host=${host} />`;
  return null;
}

function ContribBars({ host, R, showHits }) {
  const G = host.S.pgg;
  const E = R.E || host.S.settings.pggEndow;
  const rows = R.members.map((pid) => ({ a: G.alias[pid], c: R.contrib[pid], hits: (R.recv && R.recv[pid]) || 0 })).sort((x, y) => x.a - y.a);
  return html`<div class="cbars">${rows.map((x, i) => html`<div class="cbar" key=${x.a}>
    ${showHits ? html`<div class="hits ${x.hits ? 'hits-anim' : ''}">${x.hits ? `👊×${x.hits} −${x.hits * host.S.settings.pggImpact}` : ''}</div>` : null}
    <div class="cv num">${x.c}</div>
    <div class="col ${x.c ? '' : 'zero'}" style=${{ height: Math.max(2, (x.c / E) * 72) + '%', animationDelay: i * 0.08 + 's' }}></div>
    <div class="ce ${showHits && x.hits ? 'hits-anim' : ''}">${ANIMALS[x.a][0]}</div>
  </div>`)}</div>`;
}

function PGGContribReveal({ host }) {
  const G = host.S.pgg;
  const R = host.pggRound();
  const n = R.members.length;
  const shown = useCountUp(R.total, 900, R.total);
  const avgC = n ? R.total / n : 0;
  return html`<div class="stack">
    <div class="hrow">
      <div><${Kicker}>3막 · 공공재 게임 · ${G.part === 'A' ? 'A단계 · 처벌 없음' : 'B단계 · 응징 가능'} · 라운드 ${G.round + 1}<//>
        <div class="potline num">
          <span>🏦 ${Math.round(shown)}</span><span class="op">× ${R.m}</span><span>= ${fmt1(R.pot)}</span><span class="op">→ 한 명당</span><span class="hl">${fmt1(R.share)}</span>
        </div>
        <p class="h-sub">평균 ${fmt1(avgC)}개 넣었어요 · ${n}마리가 나눠 가져요${G.part === 'B' ? ' · 곧 응징 시간 👊' : ''}</p>
      </div>
      <${Gauge} host=${host} compact=${true} />
    </div>
    <div class="card" style=${{ padding: '1.2em 1.4em 1em' }}><${ContribBars} host=${host} R=${R} /></div>
  </div>`;
}

function PGGPunishReveal({ host }) {
  const R = host.pggRound();
  const totalHits = sum(Object.values(R.recv || {}));
  const punishers = Object.values(R.given || {}).filter((x) => x > 0).length;
  return html`<div class="stack">
    <div class="hrow">
      <div><${Kicker}>3막 · 공공재 게임 · B단계 · 라운드 ${host.S.pgg.round + 1}<//>
        <h1 class="h-title sm">${totalHits ? html`👊 <em>응징</em> 결과` : '이번 판엔 아무도 응징하지 않았어요'}</h1>
        <p class="h-sub">${totalHits ? `${punishers}마리가 코인 ${totalHits}개를 써서, 모두 합쳐 ${totalHits * host.S.settings.pggImpact}개를 깎았어요.` : '평화로운 판이었네요 🕊️'}</p>
      </div>
      <${Gauge} host=${host} compact=${true} />
    </div>
    <div class="card" style=${{ padding: '1.2em 1.4em 1em' }}><${ContribBars} host=${host} R=${R} showHits=${true} /></div>
  </div>`;
}

function PGGEnd({ host }) {
  const G = host.S.pgg;
  const st = host.pggStats();
  const A = st.per.filter((x) => x.part === 'A');
  const B = st.per.filter((x) => x.part === 'B');
  if (G.part === 'A') {
    const first = A.length ? A[0].rate : 0, last = A.length ? A[A.length - 1].rate : 0;
    const head = last < first - 0.08 ? '판이 갈수록 금고가 비어갔어요.' : last > first + 0.08 ? '오히려 점점 더 넣었어요!' : '꽤 꾸준히 넣었어요.';
    return html`<div class="stack anim-fade">
      <${Kicker}>3막 · 공공재 게임 · A단계 끝<//>
      <h1 class="headline">${head}</h1>
      <div class="compare">
        <div class="card cbox"><h4>판별 평균 기여율 (넣은 코인 ÷ ${host.S.settings.pggEndow})</h4>
          <${LineChart} series=${[{ color: COL.rust, pts: A.map((x) => x.rate) }]} xLabels=${A.map((x) => `A${x.idx + 1}`)} />
        </div>
        <div class="stack"><${Gauge} host=${host} />
          <div class="card cbox"><h4>생각해 볼 점</h4><p class="h-sub" style=${{ fontSize: '1em' }}>나만 안 넣으면 내 손엔 더 남아요. 그런데 다들 그렇게 하면?</p></div>
        </div>
      </div>
    </div>`;
  }
  const rA = st.rateA, rB = st.rateB;
  const d = (rB || 0) - (rA || 0);
  const head = rA === null ? '응징이 생기자 어떻게 됐을까요?' : d > 0.05 ? '응징 버튼 하나로, 금고가 다시 찼어요.' : d < -0.05 ? '응징이 생겼는데 오히려 줄었어요. 왜일까요?' : '응징이 생겨도 비슷했어요. 무엇이 달랐을까요?';
  const all = [...A, ...B];
  return html`<div class="stack anim-fade">
    <${Kicker}>3막 · 공공재 게임 · 결과<//>
    <h1 class="headline">${head}</h1>
    <div class="compare">
      <div class="card cbox"><h4>판별 평균 기여율</h4>
        <${LineChart} series=${[{ color: COL.rust, pts: all.map((x) => x.rate) }]} xLabels=${all.map((x) => `${x.part}${x.idx + 1}`)} divider=${A.length} dividerLabel="👊 등장" />
      </div>
      <div class="stack">
        <div class="card cbox"><h4>단계별 평균</h4>
          <${HBars} rows=${[{ label: html`<b>A</b> 처벌 없음`, value: rA, tone: 'gray' }, { label: html`<b>B</b> 응징 가능`, value: rB, tone: 'rust' }]} />
        </div>
        <${Gauge} host=${host} />
      </div>
    </div>
  </div>`;
}

function PGGSurprise({ host }) {
  const st = host.S.pgg ? host.pggStats() : null;
  const target = host.S.settings.jellyTarget / 100;
  const ok = st && st.gauge >= target;
  useEffect(() => { fireConfetti(); }, []);
  return html`<div class="surprise">
    <div class="gift anim-pop">🍬</div>
    <${Kicker}>서프라이즈<//>
    <h1 class="h-title" style=${{ margin: 0 }}>방금 점수, <em>젤리</em>로 바꿔 드려요</h1>
    <p class="h-sub">${!st ? '끝나고 다 같이 받아 가세요.' : ok ? `서프라이즈 게이지 ${pct(st.gauge)} · 목표 달성, 끝나고 다 같이 받아 가세요.` : `서프라이즈 게이지 ${pct(st.gauge)} · 목표엔 조금 모자랐지만 다 같이 받아 가요.`}</p>
    ${st ? html`<div style=${{ width: 'min(36em, 80vw)', marginTop: '1em' }}><${Gauge} host=${host} /></div>` : null}
    <p class="muted" style=${{ marginTop: '.6em' }}>시상이나 상장은 없어요. 가볍게 즐겨요.</p>
  </div>`;
}

/* ---------- 마무리 ---------- */
function HostFinal({ host }) {
  if (host.S.finalPhase === 'surprise') return html`<${PGGSurprise} host=${host} />`;
  const pdS = host.pdStats();
  const bS = host.botStats();
  const gS = host.pggStats();
  const c1 = pdS && pdS.rate1 !== null && pdS.rate2 !== null ? pdS.rate2 - pdS.rate1 : null;
  const c2 = gS && gS.rateA !== null && gS.rateB !== null ? gS.rateB - gS.rateA : null;
  const both = c1 !== null && c2 !== null && c1 > 0.05 && c2 > 0.05;
  const head = both ? html`같은 사람들인데, <em>규칙</em>이 바뀌니 <em>행동</em>이 바뀌었어요.` : html`오늘 우리 데이터, <em>예상대로</em>였나요?`;
  return html`<div class="stack anim-fade">
    <${Kicker}>피날레 · 오늘의 데이터<//>
    <h1 class="headline">${head}</h1>
    <div class="finals">
      <div class="card fbox"><div class="q">대결 1</div><h4>또 만나면?</h4>
        <${VBars} rows=${[{ label: '1차', value: pdS ? pdS.rate1 : null, tone: 'gray' }, { label: '2차 · 같은 상대', value: pdS ? pdS.rate2 : null, tone: 'green' }]} />
        <div class="muted" style=${{ fontSize: '.78em' }}>협력을 고른 비율</div>
      </div>
      <div class="card fbox"><div class="q">대결 2</div><h4>상대가 알고리즘이면?</h4>
        <${VBars} rows=${ALGOS.map((al, i) => ({ label: `${al.emoji} ${al.name}`, value: bS ? bS[i].coop : null, tone: al.tone }))} />
        <div class="muted" style=${{ fontSize: '.78em' }}>그 알고리즘에게 협력한 비율</div>
      </div>
      <div class="card fbox"><div class="q">공공재 게임</div><h4>응징이 생기면?</h4>
        <${VBars} rows=${[{ label: 'A · 처벌 없음', value: gS ? gS.rateA : null, tone: 'gray' }, { label: 'B · 응징 가능', value: gS ? gS.rateB : null, tone: 'rust' }]} />
        <div class="muted" style=${{ fontSize: '.78em' }}>금고에 넣은 비율</div>
      </div>
    </div>
  </div>`;
}

/* ---------- 겹쳐 뜨는 창 ---------- */
function QROverlay({ host, url }) {
  return html`<div class="overlay" onClick=${() => host.setUI({ qr: false })}>
    <div class="card qrbig" style=${{ padding: '2em' }} onClick=${(e) => e.stopPropagation()}>
      <${Kicker}>QR 찍고 들어와요<//>
      <${QR} text=${url} size="min(70vh, 80vw)" />

/* ---- ui-player.js ---- */
/* =====================================================================
 * 학생 화면 (휴대폰)
 * ===================================================================== */
const hasBatchim = (w) => {
  const c = String(w || '').charCodeAt(String(w || '').length - 1);
  return c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 !== 0;
};
const iyeyo = (w) => w + (hasBatchim(w) ? '이에요' : '예요');

function PlayerApp({ pl }) {
  useStore(pl);
  const v = pl.view;
  const pub = pl.pub;
  const live = v && (!pub || v.sid === pub.sid);
  const joining = !live && pl.name && pl.pending.some((a) => a.type === 'join');
  let body;
  if (!pub && !v) body = html`<${PConnecting} pl=${pl} />`;
  else if (!live) body = joining || (pl.name && pub) ? html`<${PJoining} pl=${pl} />` : html`<${PJoin} pl=${pl} />`;
  else body = html`<${PScreen} v=${v} pl=${pl} key=${screenKey(v)} />`;
  const showHostWait = live && !pl.hostAlive() && pl.sinceBoot() > 9000;
  return html`<div class="ph">
    <${PHead} v=${live ? v : null} pl=${pl} />
    ${showHostWait ? html`<div class="banner">⏳ 진행자 화면과 다시 연결하는 중이에요. 잠깐만 기다려 주세요.</div>` : null}
    <div class="pbody">${body}</div>
    <div class="foot">신뢰와 배신의 사회심리학</div>
  </div>`;
}

function screenKey(v) {
  const s = v.screen;
  if (s.startsWith('pd_')) return `${s}-${v.k}-${v.round}`;
  if (s === 'bots_play') return `${s}-${v.a}`;
  if (s.startsWith('pgg_')) return `${s}-${v.gr === undefined ? v.part : v.gr}`;
  return s;
}

function PHead({ v, pl }) {
  let chip = null;
  if (v && v.screen && v.screen.startsWith('pd_') && v.screen !== 'pd_intro') chip = html`<span class="scorechip num">내 점수 ${nf(v.score)}</span>`;
  if (v && v.screen && v.screen.startsWith('pgg_') && v.alias) chip = html`<span class="scorechip num">${v.alias[0]} 🪙 ${fmt1(v.total)}</span>`;
  const up = pl.netUp > 0;
  return html`<header class="phead">
    <div class="me">${v ? html`<span class="av">${v.me.avatar}</span><span class="nm">${v.me.name}</span>` : html`<b>신뢰 게임</b>`}</div>
    <div style=${{ display: 'flex', gap: '8px', alignItems: 'center' }}>
      ${chip}
      <span class="netmini"><i class="netdot ${up ? 'up' : 'connecting'}"></i></span>
    </div>
  </header>`;
}

function PConnecting({ pl }) {
  const t = useNow(1000);
  const slow = pl.sinceBoot() > 8000;
  return html`<div class="stack center" style=${{ gap: '14px', paddingTop: '40px' }}>
    <div><span class="spinner" style=${{ width: '36px', height: '36px', borderWidth: '3px' }}></span></div>
    <h2 class="ptitle">연결하는 중…</h2>
    ${slow
      ? html`<p class="psub">${pl.netUp ? '진행자 화면이 아직 안 열렸어요. 조금만 기다려 주세요.' : '연결이 잘 안 돼요. 와이파이를 끄고 데이터(LTE/5G)로 바꿔 보세요.'}</p>`
      : html`<p class="psub">잠깐이면 돼요.</p>`}
  </div>`;
}

function PJoining({ pl }) {
  const t = useNow(1000);
  return html`<div class="stack center" style=${{ gap: '14px', paddingTop: '40px' }}>
    <div><span class="spinner" style=${{ width: '36px', height: '36px', borderWidth: '3px' }}></span></div>
    <h2 class="ptitle">${pl.name} 님, 들어가는 중…</h2>
    <p class="psub">${pl.hostAlive() ? '거의 다 됐어요.' : '진행자 화면을 기다리는 중이에요.'}</p>
  </div>`;
}

function PJoin({ pl }) {
  const [name, setName] = useState('');
  const [busy, setBusy] = useState(false);
  const submit = (e) => {
    if (e) e.preventDefault();
    const n = name.trim() || randomNick();
    setBusy(true);
    pl.join(n);
  };
  return html`<form class="stack" style=${{ gap: '16px', paddingTop: '18px' }} onSubmit=${submit}>
    <${Kicker}>신뢰와 배신의 사회심리학<//>
    <h2 class="ptitle">닉네임을 정해 주세요</h2>
    <p class="psub">실명 말고 별명도 좋아요. 10자까지.</p>
    <div class="inrow">
      <input class="pinput" maxlength="10" placeholder="예: 말랑한 붕어빵" value=${name} onInput=${(e) => setName(e.target.value)} />
      <button type="button" class="dice" title="랜덤 닉네임" onClick=${() => setName(randomNick())}>🎲</button>
    </div>
    <button class="pbtn rust" type="submit" disabled=${busy}>${busy ? '들어가는 중…' : '입장하기'}</button>
    <p class="muted center" style=${{ fontSize: '13px' }}>비워 두면 랜덤 닉네임으로 들어가요</p>
  </form>`;
}

function PScreen({ v, pl }) {
  switch (v.screen) {
    case 'lobby': return html`<${PLobby} v=${v} pl=${pl} />`;
    case 'wait': return html`<${PMsg} emoji="⏳" title="잠깐만요" text=${v.msg} />`;
    case 'kicked': return html`<${PMsg} emoji="👋" title="게임에서 나왔어요" text="진행자가 내보냈어요. 다시 참여하려면 진행자에게 말해 주세요." />`;
    case 'pd_intro': return html`<${PPDIntro} v=${v} />`;
    case 'pd_choose': return html`<${PPDChoose} v=${v} pl=${pl} />`;
    case 'pd_reveal': return html`<${PPDReveal} v=${v} />`;
    case 'pd_end': return html`<${PPDEnd} v=${v} />`;
    case 'bots_intro': return html`<${PBotsIntro} v=${v} />`;
    case 'bots_play': return html`<${PBotsPlay} v=${v} pl=${pl} />`;
    case 'bots_guess': return html`<${PBotsGuess} v=${v} pl=${pl} />`;
    case 'bots_done': return html`<${PBotsDone} v=${v} />`;
    case 'bots_reveal': return html`<${PBotsReveal} v=${v} />`;
    case 'pgg_intro': return html`<${PPGGIntro} v=${v} />`;
    case 'pgg_contrib': return html`<${PPGGContrib} v=${v} pl=${pl} />`;
    case 'pgg_creveal': return html`<${PPGGCReveal} v=${v} />`;
    case 'pgg_punish': return html`<${PPGGPunish} v=${v} pl=${pl} />`;
    case 'pgg_preveal': return html`<${PPGGPReveal} v=${v} />`;
    case 'pgg_end': return html`<${PMsg} emoji=${v.part === 'A' ? '🏁' : '🎉'} title=${v.part === 'A' ? 'A단계 끝' : '공공재 게임 끝'} text=${`지금까지 모은 코인 🪙 ${fmt1(v.total)}개 · 앞 화면을 봐 주세요 👀`} />`;
    case 'pgg_surprise':
    case 'surprise': return html`<${PSurprise} v=${v} />`;
    case 'final': return html`<${PFinal} v=${v} />`;
    default: return html`<${PMsg} emoji="👀" title="앞 화면을 봐 주세요" text="" />`;
  }
}

function PMsg({ emoji, title, text }) {
  return html`<div class="stack center" style=${{ gap: '12px', paddingTop: '36px' }}>
    <div class="bigemoji anim-pop">${emoji}</div>
    <h2 class="ptitle">${title}</h2>
    ${text ? html`<p class="psub">${text}</p>` : null}
  </div>`;
}

function PLobby({ v, pl }) {
  const [cool, setCool] = useState(false);
  return html`<div class="stack center" style=${{ gap: '16px', paddingTop: '26px', alignItems: 'center' }}>
    <div class="bigemoji anim-pop">${v.me.avatar}</div>
    <h2 class="ptitle">${v.me.name} 님,<br />들어왔어요</h2>
    <p class="psub">앞 화면을 봐 주세요. 곧 시작해요.<br />지금 <b>${v.n}명</b> 들어와 있어요.</p>
    <button class="wavebtn" disabled=${cool} onClick=${() => { pl.send('wave', {}); setCool(true); setTimeout(() => setCool(false), 1500); }}><span class="h">👋</span> 손 흔들기</button>
    <p class="muted" style=${{ fontSize: '13px', margin: 0 }}>누르면 앞 화면에서 내 이름이 인사해요</p>
    <button class="linkbtn" onClick=${() => { const n = prompt('새 닉네임 (10자까지)', v.me.name); if (n && n.trim()) pl.rename(n); }}>닉네임 바꾸기</button>
  </div>`;
}

/* ---------- 대결 1 ---------- */
function PayMini() {
  return html`<table class="paytable">
    <thead><tr><th>내 점수</th><th>상대 🤝</th><th>상대 😈</th></tr></thead>
    <tbody>
      <tr><th>나 🤝</th><td class="cc">+2</td><td style=${{ color: COL.red }}>−1</td></tr>
      <tr><th>나 😈</th><td>+3</td><td>0</td></tr>
    </tbody>
  </table>`;
}

function PPDIntro({ v }) {
  const first = v.k === 1;
  const title = first ? (v.mode === 'stranger' ? `매 판 새로운 상대와 ${v.rounds}판` : `같은 상대와 ${v.rounds}판`) : `이번엔 같은 상대와 ${v.rounds}판 해요`;
  const sub = first ? (v.mode === 'stranger' ? '누구랑 붙는지 몰라요. 한 번 만난 상대는 다시 안 만나요.' : '상대는 끝까지 그대로예요.') : v.named ? '이번엔 상대가 누군지 알려 줘요.' : '이번엔 상대가 끝까지 안 바뀌어요.';
  return html`<div class="stack" style=${{ gap: '14px' }}>
    <${Kicker}>대결 1 · ${first ? '1차' : '2차'}<//>
    <h2 class="ptitle">${title}</h2>
    <p class="psub">${sub}</p>
    <div class="pcard"><${PayMini} /></div>
    <p class="psub center">곧 시작해요. 앞 화면을 봐 주세요 👀</p>
  </div>`;
}

function PartnerCard({ p, k, mode }) {
  let face = '?', who = '상대: ???', note = '';
  const fixed = k === 2 || mode === 'fixed';
  if (p.kind === 'named') { face = p.avatar; who = p.name; note = '끝까지 같은 상대예요'; }
  else if (p.kind === 'bot') { face = '🤖'; who = '알고리즘'; note = '인원이 홀수라 알고리즘이 자리를 채웠어요'; }
  else note = fixed ? '끝까지 같은 상대예요 · 누군지는 비밀' : '이번 판에만 만나는 상대예요';
  return html`<div class="pcard partner">
    <div class="face">${face}</div>
    <div><div class="who">${who}</div><div class="note">${note}</div></div>
  </div>`;
}

function PDHist({ hist }) {
  if (!hist || !hist.length) return null;
  return html`<div class="hist">
    <span class="muted" style=${{ fontSize: '13px', fontWeight: 600 }}>지난 판 (나:상대)</span>
    ${hist.map((x, i) => html`<span class="h" key=${i}>${CHOICE[x.m].emoji}<span class="muted">:</span>${CHOICE[x.o].emoji}</span>`)}
  </div>`;
}

function Timer({ deadline, pl }) {
  useNow(250);
  if (!deadline) return null;
  const left = deadline - pl.hostNow();
  const sec = Math.max(0, Math.ceil(left / 1000));
  return html`<span class="timer num ${sec <= 5 ? 'low' : ''}">⏱ ${sec}초</span>`;
}

function PPDChoose({ v, pl }) {
  const [picked, setPicked] = useState(null);
  const mine = v.mine || picked;
  const choose = (c) => {
    if (mine) return;
    setPicked(c);
    pl.send('pd', { k: v.k, r: v.round, c });
    if (navigator.vibrate) navigator.vibrate(15);
  };
  return html`<div class="stack" style=${{ gap: '14px' }}>
    <div class="hrow" style=${{ alignItems: 'center' }}>
      <div><${Kicker}>대결 1 · ${v.k === 1 ? '1차' : '2차'}<//><h2 class="ptitle">라운드 ${v.round + 1} / ${v.rounds}</h2></div>
      ${!mine ? html`<${Timer} deadline=${v.deadline} pl=${pl} />` : null}
    </div>
    <${PartnerCard} p=${v.partner} k=${v.k} mode=${v.mode} />
    <div class="choices">
      ${['C', 'D'].map((c) => html`<button class="choice tone-${CHOICE[c].tone} ${mine === c ? 'sel' : ''} ${mine && mine !== c ? 'dim' : ''}" disabled=${!!mine} onClick=${() => choose(c)}>
        <span class="e">${CHOICE[c].emoji}</span>
        <span class="l">${CHOICE[c].label}</span>
        <span class="s">${c === 'C' ? html`상대 협력 +2<br />상대 배신 −1` : html`상대 협력 +3<br />상대 배신 0`}</span>
      </button>`)}
    </div>
    ${mine
      ? html`<div class="pcard center anim-fade"><b>${CHOICE[mine].emoji} ${CHOICE[mine].label}</b>을 골랐어요. 상대를 기다리는 중<span class="wait-dots"><span>.</span><span>.</span><span>.</span></span></div>`
      : html`<p class="psub center">하나만 골라 주세요. 고르면 못 바꿔요.</p>`}
    <${PDHist} hist=${v.hist} />
  </div>`;
}

function PPDReveal({ v }) {
  const info = outcomeInfo(v.mine, v.theirs);
  useEffect(() => {
    if (v.mine === 'C' && v.theirs === 'D' && navigator.vibrate) navigator.vibrate([70, 50, 70]);
  }, []);
  const who = v.partner.kind === 'named' ? v.partner.name : v.partner.kind === 'bot' ? '알고리즘' : '상대';
  return html`<div class="stack" style=${{ gap: '14px' }}>
    <${Kicker}>대결 1 · ${v.k === 1 ? '1차' : '2차'} · 라운드 ${v.round + 1}/${v.rounds}<//>
    <div class="result tone-${info.tone} anim-pop">
      <div class="e ${info.tone === 'red' ? 'anim-shake' : ''}">${info.emoji}</div>
      <div class="t">${info.title}</div>
      <div class="pts num">${signed(v.pay)}</div>

    </div>
    ${v.forced ? html`<div class="banner">시간이 다 돼서 자동으로 협력했어요</div>` : null}
    ${v.partner.kind === 'bot' && v.k === 1 && v.mode === 'stranger' ? html`<p class="psub center">이번 상대는 🤖 알고리즘이었어요. 인원이 홀수라 자리를 채웠어요.</p>` : null}
    <div class="pcard"><div class="kv"><span>${v.k === 1 ? '1차' : '2차'} 내 점수</span><b class="num">${nf(v.score)}점</b></div></div>
    <${PDHist} hist=${v.hist} />
    <p class="psub center">${v.last ? '마지막 판이었어요. 앞 화면을 봐 주세요.' : '곧 다음 판이 시작돼요'}</p>
  </div>`;
}

function PPDEnd({ v }) {
  return html`<div class="stack center" style=${{ gap: '14px', paddingTop: '14px', alignItems: 'center' }}>
    <${Kicker}>대결 1 · ${v.k === 1 ? '1차' : '2차'} 끝<//>

    <h2 class="ptitle">내 점수 <span class="num">${nf(v.score)}</span>점</h2>
    <p class="psub">${v.rounds}판 중 협력 ${v.coopN}번</p>

    <p class="psub">앞 화면을 봐 주세요 👀</p>
  </div>`;
}

/* ---------- 대결 2 ---------- */
function Orbs({ size = 54 }) {
  return html`<div style=${{ display: 'flex', gap: '14px', justifyContent: 'center' }}>${ALGOS.map((al) => html`<div class="tone-${al.tone}" style=${{ textAlign: 'center' }}>
    <div class="orbp" style=${{ width: size + 'px', height: size + 'px', margin: '0 auto' }}>?</div>
    <div style=${{ fontSize: '13px', fontWeight: 700, marginTop: '6px' }}>${al.dot} ${al.no}</div>
  </div>`)}</div>`;
}

function PBotsIntro({ v }) {
  return html`<div class="stack center" style=${{ gap: '16px', paddingTop: '10px' }}>
    <${Kicker}>대결 2 · 알고리즘 전용<//>
    <h2 class="ptitle">이번엔 알고리즘이랑 해요</h2>
    <p class="psub">알고리즘 3개와 ${v.rounds}판씩 해요.<br />어떻게 나오는지 잘 봐 두세요. 끝나면 정체를 맞혀요.</p>
    <${Orbs} />
    <p class="psub">곧 시작해요 👀</p>

function BotHistory({ hist, small }) {
  if (!hist || !hist.length) return null;
  return html`<div class="pcard" style=${{ padding: small ? '10px 12px' : '12px 14px' }}>
    <div style=${{ display: 'grid', gridTemplateColumns: '64px 1fr', gap: '6px', alignItems: 'center', fontSize: '14px' }}>
      <span class="muted" style=${{ fontWeight: 700, fontSize: '12px' }}>나</span>
      <span>${hist.map((x) => CHOICE[x.p].emoji).join(' ')}</span>
      <span class="muted" style=${{ fontWeight: 700, fontSize: '12px' }}>알고리즘</span>
      <span>${hist.map((x) => CHOICE[x.b].emoji).join(' ')}</span>
    </div>
  </div>`;
}

function PBotsPlay({ v, pl }) {
  const al = ALGOS[v.a];
  const [intro, setIntro] = useState(v.a > 0 && v.hist.length === 0 && !!v.prev);
  const [pend, setPend] = useState(null);
  const [shown, setShown] = useState(v.hist.length);
  useEffect(() => {
    if (v.hist.length > shown) {
      const wait = pend ? Math.max(0, 650 - (now() - pend.at)) : 0;
      const id = setTimeout(() => { setShown(v.hist.length); setPend(null); }, wait);
      return () => clearTimeout(id);
    }
    return undefined;
  }, [v.hist.length]);
  const hist = v.hist.slice(0, shown);
  const r = hist.length;
  const last = r ? hist[r - 1] : null;
  const busy = !!pend || shown < v.hist.length;
  const choose = (c) => {
    if (busy) return;
    setPend({ c, at: now() });
    pl.send('bot', { a: v.a, r: v.hist.length, c });
    if (navigator.vibrate) navigator.vibrate(12);
  };
  if (intro) {
    const prevAl = ALGOS[v.a - 1];
    const prevScore = v.score[v.a - 1];
    return html`<div class="stack center" style=${{ gap: '14px', paddingTop: '8px' }}>
      <${Kicker}>대결 2 · 상대 ${v.a}/3 끝<//>
      <h2 class="ptitle">${prevAl.dot} 알고리즘 ${prevAl.no}<br />대결 끝</h2>
      <div class="pcard" style=${{ textAlign: 'left' }}><div class="kv"><span>이번 대결 점수</span><b class="num">${nf(prevScore)}점</b></div></div>
      <${BotHistory} hist=${v.prev} />
      <div class="pcard tone-${al.tone}"><div class="botrow" style=${{ justifyContent: 'center' }}><div class="orbp">?</div><div style=${{ textAlign: 'left' }}><div class="muted" style=${{ fontSize: '13px', fontWeight: 700 }}>다음 상대</div><div style=${{ fontWeight: 800, fontSize: '19px' }}>${al.dot} 알고리즘 ${al.no}</div></div></div></div>
      <button class="pbtn rust" onClick=${() => setIntro(false)}>시작하기</button>
    </div>`;
  }
  return html`<div class="stack" style=${{ gap: '12px' }}>
    <${Kicker}>대결 2 · 상대 ${v.a + 1}/3<//>
    <div class="pcard tone-${al.tone}">
      <div class="botrow">
        <div class="orbp">${busy ? html`<span class="spinner" style=${{ width: '22px', height: '22px' }}></span>` : '?'}</div>
        <div style=${{ flex: 1 }}>
          <div style=${{ fontWeight: 800, fontSize: '19px' }}>${al.dot} 알고리즘 ${al.no}</div>
          <div class="muted num" style=${{ fontSize: '13px', fontWeight: 700 }}>${Math.min(r + 1, v.rounds)} / ${v.rounds}판 · 이 상대 점수 ${nf(hist.reduce((s, x) => s + x.pay, 0))}</div>
        </div>
        <div class="steps">${range(v.rounds).map((i) => html`<i class=${i < r ? 'on' : ''}></i>`)}</div>
      </div>
    </div>
    ${last && !busy ? html`<div class="result tone-${outcomeInfo(last.p, last.b).tone} anim-pop" key=${'r' + r} style=${{ padding: '14px' }}>
      <div class="t" style=${{ marginTop: 0, fontSize: '19px' }}>알고리즘은 ${CHOICE[last.b].emoji} ${CHOICE[last.b].label}</div>
      <div class="d">나 ${CHOICE[last.p].emoji} ${CHOICE[last.p].label} → <b class="num">${signed(last.pay)}</b></div>
    </div>` : busy ? html`<div class="pcard center"><span class="muted">🤖 알고리즘이 고르는 중<span class="wait-dots"><span>.</span><span>.</span><span>.</span></span></span></div>` : html`<p class="psub center">첫 판이에요. 하나 골라 보세요.</p>`}
    <div class="choices">
      ${['C', 'D'].map((c) => html`<button class="choice tone-${CHOICE[c].tone} ${pend && pend.c === c ? 'sel' : ''} ${pend && pend.c !== c ? 'dim' : ''}" disabled=${busy} onClick=${() => choose(c)}>
        <span class="e">${CHOICE[c].emoji}</span><span class="l">${CHOICE[c].label}</span>
      </button>`)}
    </div>
    <${BotHistory} hist=${hist} small=${true} />
  </div>`;
}

function PBotsGuess({ v, pl }) {
  const [g, setG] = useState([null, null, null]);
  const [sent, setSent] = useState(false);
  return html`<div class="stack" style=${{ gap: '12px' }}>
    <${Kicker}>대결 2 · 정체 맞히기<//>
    <h2 class="ptitle">알고리즘 정체를 맞혀 보세요</h2>
    <p class="psub">붙어 본 느낌대로 하나씩 골라요.</p>
    ${ALGOS.map((al, i) => html`<div class="pcard guess tone-${al.tone}" key=${i}>
      <div class="botrow"><div class="orbp" style=${{ width: '42px', height: '42px', fontSize: '17px' }}>?</div>
        <div><b>${al.dot} 알고리즘 ${al.no}</b><div class="muted num" style=${{ fontSize: '13px', fontWeight: 600 }}>내 점수 ${nf(v.score[i])}점</div></div></div>
      <${BotHistory} hist=${v.hists[i]} small=${true} />
      <div class="gopts">${GUESS_OPTS.map((o) => html`<button class="gopt ${g[i] === o.key ? 'sel' : ''}" onClick=${() => { const n = g.slice(); n[i] = o.key; setG(n); }}>${o.emoji} ${o.name}</button>`)}</div>
    </div>`)}
    <button class="pbtn rust" disabled=${g.some((x) => !x) || sent} onClick=${() => { setSent(true); pl.send('guess', { g }); }}>${sent ? '제출 중…' : g.some((x) => !x) ? '셋 다 골라 주세요' : '제출하기'}</button>
  </div>`;
}

const guessLabel = (k) => { const o = GUESS_OPTS.find((x) => x.key === k); return o ? `${o.emoji} ${o.name}` : '–'; };

function PBotsDone({ v }) {
  return html`<div class="stack" style=${{ gap: '12px' }}>
    <div class="center" style=${{ paddingTop: '8px' }}><div class="bigemoji anim-pop">🕵️</div></div>
    <h2 class="ptitle center">제출했어요</h2>
    <p class="psub center">다른 친구들도 끝나면 앞 화면에서 하나씩 열어 볼게요.</p>
    <div class="pcard">${ALGOS.map((al, i) => html`<div class="kv"><span>${al.dot} 알고리즘 ${al.no} <span class="muted num">(${nf(v.score[i])}점)</span></span><b>${guessLabel(v.guess[i])}</b></div>`)}</div>
  </div>`;
}

function PBotsReveal({ v }) {
  const correct = v.guess ? v.guess.filter((g, i) => v.revealed[i] && g === ALGOS[i].key).length : 0;
  return html`<div class="stack" style=${{ gap: '12px' }}>
    <${Kicker}>대결 2 · 정체 공개<//>
    <h2 class="ptitle">${v.revealed.every(Boolean) ? (v.guess ? `3개 중 ${correct}개 맞혔어요` : '정체가 모두 공개됐어요') : '앞 화면에서 하나씩 열려요'}</h2>
    ${ALGOS.map((al, i) => {
      const open = v.revealed[i];
      const ok = v.guess && v.guess[i] === al.key;
      return html`<div class="pcard tone-${al.tone} ${open ? 'anim-flip' : ''}" key=${i + (open ? 'o' : 'c')}>
        <div class="botrow">
          <div class="orbp" style=${{ width: '48px', height: '48px', fontSize: open ? '24px' : '18px' }}>${open ? al.emoji : '?'}</div>
          <div style=${{ flex: 1 }}>
            <div style=${{ fontWeight: 800 }}>${al.dot} ${al.no} ${open ? al.name : '???'}</div>
            <div class="muted" style=${{ fontSize: '13px', fontWeight: 600 }}>내 답: ${v.guess ? guessLabel(v.guess[i]) : '없음'} · 내 점수 ${nf(v.score[i])}점</div>
          </div>
          ${open && v.guess ? html`<div style=${{ fontSize: '26px' }}>${ok ? '⭕' : '❌'}</div>` : null}
        </div>
      </div>`;
    })}
    <p class="psub center">앞 화면을 봐 주세요 👀</p>
  </div>`;
}

/* ---------- 공공재 게임 ---------- */

    <div><${Kicker}>공공재 · ${v.part === 'A' ? 'A단계' : 'B단계'}${v.gr !== undefined ? ` · 라운드 ${v.round + 1}/${v.rounds}` : ''}<//></div>

  </div>`;
}

function PPGGIntro({ v }) {
  const B = v.part === 'B';
  return html`<div class="stack center" style=${{ gap: '14px', alignItems: 'stretch' }}>
    <${Kicker}>공공재 게임 · ${B ? 'B단계 · 응징 등장' : 'A단계'}<//>
    <div class="mask-me anim-pop">${v.alias[0]}</div>
    <h2 class="ptitle">이번 게임에서 나는<br /><em>${iyeyo(v.alias[1])}</em></h2>
    <p class="psub">내 화면에만 보여요. 아무도 몰라요 🤫</p>
    <div class="pcard" style=${{ textAlign: 'left' }}>
      ${B
        ? html`<div class="kv"><span>👊 1개 쓰면</span><b>내 코인 −1</b></div><div class="kv"><span>맞은 동물은</span><b>−${v.impact}</b></div><div class="kv"><span>한 판에 최대</span><b>${v.maxP}개</b></div><div class="kv"><span>안 써도</span><b>괜찮아요</b></div>`
        : html`<div class="kv"><span>매 판 받는 코인</span><b>🪙 ${v.E}개</b></div><div class="kv"><span>금고에 넣으면</span><b>×${v.m}</b></div><div class="kv"><span>금고는</span><b>모두 똑같이 나눠요</b></div><div class="kv"><span>안 넣은 코인</span><b>그대로 내 거</b></div>`}
    </div>
    <p class="psub">곧 시작해요. 앞 화면을 봐 주세요 👀</p>
  </div>`;
}

function PPGGContrib({ v, pl }) {
  const [val, setVal] = useState(null);
  const [sent, setSent] = useState(false);
  const mine = v.mine !== null && v.mine !== undefined ? v.mine : sent ? val : null;
  if (mine !== null) {
    return html`<div class="stack center" style=${{ gap: '12px', alignItems: 'stretch' }}>
      <${MaskHead} v=${v} />
      <div class="pcard center anim-fade" style=${{ padding: '22px' }}>
        <div style=${{ fontSize: '44px' }}>🏦</div>
        <h2 class="ptitle">금고에 <span class="num">${mine}</span>개 넣었어요</h2>
        <p class="psub">내 손에 ${v.E - mine}개 · 다른 동물들 기다리는 중<span class="wait-dots"><span>.</span><span>.</span><span>.</span></span> <span class="num">${v.done}/${v.n}</span></p>
      </div>
    </div>`;
  }
  const qs = [0, Math.round(v.E * 0.3), Math.round(v.E * 0.7), v.E];
  return html`<div class="stack" style=${{ gap: '12px' }}>
    <${MaskHead} v=${v} />
    <div class="hrow" style=${{ alignItems: 'center' }}><h2 class="ptitle">🪙 ${v.E}개 중 금고에 몇 개?</h2><${Timer} deadline=${v.deadline} pl=${pl} /></div>
    <div class="pcard">
      <div class="stepper">
        <button onClick=${() => setVal(clamp((val === null ? 1 : val) - 1, 0, v.E))}>−</button>
        <div class="val num">${val === null ? '–' : val}</div>
        <button onClick=${() => setVal(clamp((val === null ? -1 : val) + 1, 0, v.E))}>+</button>
      </div>
      <div class="quick" style=${{ marginTop: '12px' }}>${qs.map((q) => html`<button onClick=${() => setVal(q)} style=${val === q ? { borderColor: COL.rust, color: COL.rust } : null}>${q}</button>`)}</div>
      <div class="split" style=${{ marginTop: '14px' }}><span>🏦 금고에 <b class="num">${val === null ? '–' : val}</b></span><span>✋ 내 손에 <b class="num">${val === null ? '–' : v.E - val}</b></span></div>
    </div>
    <button class="pbtn rust" disabled=${val === null} onClick=${() => { setSent(true); pl.send('contrib', { gr: v.gr, n: val }); }}>${val === null ? '개수를 골라 주세요' : `금고에 ${val}개 넣기`}</button>
    <p class="psub center">금고는 ×${v.m}이 돼서 ${v.n}마리가 똑같이 나눠요.</p>
  </div>`;
}

function AnimalBars({ rows, E, showHits, impact }) {
  const sorted = rows.slice().sort((a, b) => a.a - b.a);
  return html`<div class="rowbars">${sorted.map((x, i) => html`<div class="rb ${x.me ? 'me' : ''}">
    <span style=${{ fontSize: '20px' }}>${ANIMALS[x.a][0]}</span>
    <div class="tr"><div class="fl" style=${{ width: ((x.c || 0) / E) * 100 + '%', animationDelay: i * 0.06 + 's' }}></div></div>
    <span class="num" style=${{ whiteSpace: 'nowrap' }}>${x.c}${x.me ? html`<span class="tag-me">나</span>` : ''}</span>
  </div>${showHits && x.hits ? html`<div class="muted" style=${{ fontSize: '12px', fontWeight: 700, margin: '-2px 0 2px 38px', color: COL.red }}>👊×${x.hits} (−${x.hits * impact})</div>` : null}`)}</div>`;
}

function PPGGCReveal({ v }) {
  return html`<div class="stack" style=${{ gap: '12px' }}>
    <${MaskHead} v=${v} />
    <div class="pcard center anim-pop">
      <div class="muted" style=${{ fontWeight: 700, fontSize: '13px' }}>금고 공개</div>
      <div style=${{ fontSize: '26px', fontWeight: 900, letterSpacing: '-.02em', marginTop: '4px' }} class="num">🏦 ${v.sumC} × ${v.m} = ${fmt1(v.pot)}</div>
      <div style=${{ fontSize: '17px', fontWeight: 700, color: COL.rust, marginTop: '2px' }} class="num">한 마리당 ${fmt1(v.share)}</div>
    </div>
    <div class="pcard">
      <div class="kv"><span>손에 남긴 코인</span><b class="num">${v.E - v.mine}</b></div>
      <div class="kv"><span>금고에서 받은 몫</span><b class="num">+${fmt1(v.share)}</b></div>
      <div class="kv"><span>${v.part === 'A' ? '이번 판 내 코인' : '응징 전 내 코인'}</span><b class="num">${fmt1(v.base)}</b></div>
    </div>
    <div class="pcard"><div class="muted" style=${{ fontSize: '13px', fontWeight: 700, marginBottom: '8px' }}>누가 얼마나 넣었나</div><${AnimalBars} rows=${v.rows} E=${v.E} /></div>
    <p class="psub center">${v.part === 'B' ? '곧 응징 시간이에요 👊' : `지금까지 모은 코인 🪙 ${fmt1(v.total)}`}</p>
  </div>`;
}

function PPGGPunish({ v, pl }) {
  const [alloc, setAlloc] = useState({});
  const [sent, setSent] = useState(false);
  const used = sum(Object.values(alloc));
  const done = v.mine || sent;
  const submit = (a) => { setSent(true); pl.send('punish', { gr: v.gr, alloc: a }); };
  if (done) {
    const u = v.mine ? sum(Object.values(v.mine)) : used;
    return html`<div class="stack center" style=${{ gap: '12px', alignItems: 'stretch' }}>
      <${MaskHead} v=${v} />
      <div class="pcard center anim-fade" style=${{ padding: '22px' }}>
        <div style=${{ fontSize: '44px' }}>${u ? '👊' : '🕊️'}</div>
        <h2 class="ptitle">${u ? `👊 ${u}개 쓰기로 했어요` : '이번엔 넘어가기로 했어요'}</h2>
        <p class="psub">다른 동물들 기다리는 중<span class="wait-dots"><span>.</span><span>.</span><span>.</span></span></p>
      </div>
    </div>`;
  }
  const rows = v.rows.slice().sort((a, b) => a.c - b.c);
  return html`<div class="stack" style=${{ gap: '12px' }}>
    <${MaskHead} v=${v} />
    <div class="hrow" style=${{ alignItems: 'center' }}><h2 class="ptitle">응징할 동물이 있나요? 👊</h2><${Timer} deadline=${v.deadline} pl=${pl} /></div>
    <p class="psub">👊 1개 = 내 코인 −1 · 맞은 동물 −${v.impact}<br /><span class="muted">나는 금고에 ${v.myC}개 넣었어요</span></p>
    <div class="pcard" style=${{ padding: '6px 14px' }}>${rows.map((x) => {
      const k = alloc[x.a] || 0;
      return html`<div class="prow2" key=${x.a}>
        <div class="who"><span class="e">${ANIMALS[x.a][0]}</span><div><div>${ANIMALS[x.a][1]}</div><div class="cc num">금고에 ${x.c}개</div></div></div>
        <div class="mini">
          <button disabled=${!k} onClick=${() => setAlloc({ ...alloc, [x.a]: k - 1 })}>−</button>
          <div class="k num">${k ? '👊' + k : '0'}</div>
          <button disabled=${used >= v.maxP} onClick=${() => setAlloc({ ...alloc, [x.a]: k + 1 })}>+</button>
        </div>
      </div>`;
    })}</div>
    <div class="split"><span>쓴 👊 <b class="num">${used}/${v.maxP}</b></span><span>내 코인 <b class="num">${used ? '−' + used : '0'}</b></span></div>
    <div style=${{ display: 'grid', gridTemplateColumns: '1fr 1.4fr', gap: '10px' }}>
      <button class="pbtn ghost" onClick=${() => submit({})}>안 할래요</button>
      <button class="pbtn rust" disabled=${!used} onClick=${() => submit(alloc)}>${used ? `👊 ${used}개 확정` : '골라 주세요'}</button>
    </div>
  </div>`;
}

function PPGGPReveal({ v }) {
  const loss = Math.min(v.base, v.recv * v.impact);
  const tone = v.recv ? 'red' : v.given ? 'amber' : 'green';
  return html`<div class="stack" style=${{ gap: '12px' }}>
    <${MaskHead} v=${v} />
    <div class="result tone-${tone} anim-pop">
      <div class="e ${v.recv ? 'anim-shake' : ''}">${v.recv ? '😵' : v.given ? '👊' : '🕊️'}</div>
      <div class="t">${v.recv ? `👊 ${v.recv}개 맞았어요` : v.given ? `👊 ${v.given}개 썼어요` : '평화로운 판'}</div>
      <div class="pts num">${fmt1(v.pay)}</div>
      <div class="d">이번 판 최종 코인</div>
    </div>
    <div class="pcard">
      <div class="kv"><span>응징 전</span><b class="num">${fmt1(v.base)}</b></div>
      <div class="kv"><span>맞은 👊 ${v.recv}개</span><b class="num" style=${{ color: v.recv ? COL.red : null }}>${loss ? '−' + fmt1(loss) : '0'}</b></div>
      <div class="kv"><span>쓴 👊 ${v.given}개</span><b class="num">${v.given ? '−' + v.given : '0'}</b></div>
      <div class="kv"><span>지금까지 모은 코인</span><b class="num">🪙 ${fmt1(v.total)}</b></div>
    </div>
    <div class="pcard"><div class="muted" style=${{ fontSize: '13px', fontWeight: 700, marginBottom: '8px' }}>넣은 코인과 맞은 👊</div><${AnimalBars} rows=${v.rows} E=${v.E} showHits=${true} impact=${v.impact} /></div>
  </div>`;
}

function PSurprise({ v }) {
  useEffect(() => { fireConfetti(2600); }, []);
  const has = v.gauge !== null && v.gauge !== undefined;
  const ok = has && v.gauge >= v.target;
  return html`<div class="stack center" style=${{ gap: '12px', paddingTop: '20px' }}>
    <div class="bigemoji anim-pop" style=${{ fontSize: '84px' }}>🍬</div>
    <h2 class="ptitle">방금 점수,<br /><em>젤리</em>로 바꿔 드려요</h2>
    <p class="psub">${!has ? '끝나고 다 같이 받아 가세요.' : ok ? '목표 달성, 끝나고 받아 가세요.' : '목표엔 조금 모자랐지만 오늘은 다 같이 받아 가요.'}</p>
    ${has ? html`<div class="pcard"><div class="kv"><span>🎁 서프라이즈 게이지</span><b class="num">${pct(v.gauge)}</b></div>${v.total !== null && v.total !== undefined ? html`<div class="kv"><span>내가 모은 코인</span><b class="num">🪙 ${fmt1(v.total)}</b></div>` : null}</div>` : null}
  </div>`;
}

function PFinal({ v }) {
  return html`<div class="stack" style=${{ gap: '12px' }}>
    <div class="center" style=${{ paddingTop: '8px' }}><div class="bigemoji anim-pop">🎉</div></div>
    <h2 class="ptitle center">오늘 내 기록</h2>
    <div class="pcard">
      ${v.pd ? html`<div class="kv"><span>대결 1 · 1차</span><b class="num">${v.pd[0] === null ? '–' : nf(v.pd[0]) + '점'}</b></div><div class="kv"><span>대결 1 · 2차</span><b class="num">${v.pd[1] === null ? '–' : nf(v.pd[1]) + '점'}</b></div>` : null}
      ${v.bots ? html`${ALGOS.map((al, i) => html`<div class="kv"><span>대결 2 · ${al.emoji} ${al.name}</span><b class="num">${nf(v.bots.score[i])}점</b></div>`)}
        <div class="kv"><span>정체 맞히기</span><b class="num">${v.bots.correct === null ? '–' : v.bots.correct + '/3'}</b></div>` : null}
      ${v.pgg !== undefined ? html`<div class="kv"><span>공공재 게임</span><b class="num">🪙 ${fmt1(v.pgg)}</b></div>` : null}
    </div>
    <p class="psub center">끝까지 함께해 줘서 고마워요.</p>
  </div>`;
}

/* ---- boot.js ---- */
/* =====================================================================
 * 시작
 * ===================================================================== */
(function start() {
  const params = readParams();
  const root = document.getElementById('app');
  root.innerHTML = '';
  if (params.isHost) {
    if (params.hostPin !== CONFIG.HOST_PIN) {
      render(html`<div class="boot">진행자 주소가 맞지 않아요. 주소 끝의 비밀번호를 확인해 주세요.</div>`, root);
      return;
    }
    document.title = '신뢰 게임 · 진행자';
    const net = createNet({ local: params.local, brokers: params.brokers });
    const host = createHost(params, net);
    host.boot();
    window.__tg = { host, net, params };
    render(html`<${HostApp} host=${host} net=${net} />`, root);
  } else {
    const net = createNet({ local: params.local, brokers: params.brokers });
    const pl = createPlayer(params, net);
    window.__tg = { pl, net, params };
    render(html`<${PlayerApp} pl=${pl} />`, root);
  }
})();

})();
</script>
</body>
</html>
