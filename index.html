<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EE">
<meta name="robots" content="noindex">
<title>신뢰 게임</title>
<script>
/* ============================================================
 * 신뢰 게임 설정: 바꿀 일이 있으면 여기만 고치세요
 *   진행자 화면 : 이 파일 주소 뒤에 ?host=HOST_PIN
 *   학생 화면   : 이 파일 주소 그대로 (QR)
 *   ROOM을 바꾸면 이전 기록과 분리된 새 방이 됩니다 (QR 주소는 그대로).
 * ============================================================ */
window.TG_CONFIG = {
  HOST_PIN: '2303',
  ROOM: '2qwkrwe7kk',
};
</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg: #F7F4EE;
  --card: #FFFFFF;
  --line: #EAE4DA;
  --line2: #DDD5C9;
  --ink: #1E1D1B;
  --ink2: #5E5852;
  --ink3: #9A938A;
  --rust: #C4573A;
  --rust-ink: #A7432A;
  --rust-soft: #F4E3DA;
  --green: #3B8A57;
  --green-soft: #E3F0E6;
  --red: #CF4B3E;
  --red-soft: #FBE5E1;
  --yellow: #B98912;
  --yellow-soft: #FAF0D2;
  --gray: #8B847B;
  --gray-soft: #EEEAE4;
  --amber: #C9822A;
  --amber-soft: #FBEEDC;
  --shadow: 0 1px 2px rgba(30, 29, 27, .04), 0 8px 28px rgba(30, 29, 27, .06);
  --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; min-height: 100dvh; }
button { font-family: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
input { font-family: inherit; }
.num { font-variant-numeric: tabular-nums; }
em { font-style: normal; color: var(--rust); }
.muted { color: var(--ink3); }
.boot { display: grid; place-items: center; min-height: 100vh; color: var(--ink3); font-size: 15px; }

/* ---------- 공통 조각 ---------- */
.kicker { display: inline-flex; align-items: center; gap: .5em; color: var(--rust); font-weight: 700; font-size: .78em; letter-spacing: -.01em; }
.kdot { width: .42em; height: .42em; border-radius: 50%; background: var(--rust); display: inline-block; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
.pill { display: inline-flex; align-items: center; gap: .4em; padding: .3em .8em; border-radius: 999px; background: var(--gray-soft); color: var(--ink2); font-weight: 600; font-size: .8em; white-space: nowrap; }
.pill.rust { background: var(--rust-soft); color: var(--rust-ink); }
.pill.green { background: var(--green-soft); color: var(--green); }
.pill.red { background: var(--red-soft); color: var(--red); }
.tone-green { --tone: var(--green); --tone-soft: var(--green-soft); }
.tone-red { --tone: var(--red); --tone-soft: var(--red-soft); }
.tone-yellow { --tone: var(--yellow); --tone-soft: var(--yellow-soft); }
.tone-gray { --tone: var(--gray); --tone-soft: var(--gray-soft); }
.tone-amber { --tone: var(--amber); --tone-soft: var(--amber-soft); }
.tone-rust { --tone: var(--rust); --tone-soft: var(--rust-soft); }

@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
@keyframes flipIn { 0% { transform: scaleX(.15); opacity: 0; } 60% { transform: scaleX(1.03); opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes fadeUp { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px) rotate(-2deg); } 40% { transform: translateX(7px) rotate(2deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
@keyframes wave { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(18deg); } 50% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-14px); } 60% { transform: translateY(0); } 80% { transform: translateY(-5px); } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(196, 87, 58, .45); } 50% { box-shadow: 0 0 0 10px rgba(196, 87, 58, 0); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes dots { 0%, 20% { opacity: .2; } 50% { opacity: 1; } 100% { opacity: .2; } }
.anim-pop { animation: pop .45s cubic-bezier(.2, .9, .3, 1.2) both; }
.anim-flip { animation: flipIn .5s ease-out both; }
.anim-fade { animation: fadeUp .45s ease-out both; }
.anim-shake { animation: shake .6s ease-in-out both; }
.spinner { width: 1.2em; height: 1.2em; border: 2px solid var(--line2); border-top-color: var(--rust); border-radius: 50%; animation: spin .9s linear infinite; display: inline-block; vertical-align: -.2em; }
.wait-dots span { animation: dots 1.4s infinite; }
.wait-dots span:nth-child(2) { animation-delay: .2s; }
.wait-dots span:nth-child(3) { animation-delay: .4s; }

/* ---------- 진행자 화면 (프로젝터) ---------- */
.host { font-size: clamp(12px, 1.05vw, 26px); height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
.htop { display: flex; align-items: center; justify-content: space-between; padding: 1.1em 2.4em .4em; gap: 1em; }
.htop .right { display: flex; align-items: center; gap: .8em; }
.netdots { display: inline-flex; gap: .35em; align-items: center; color: var(--ink3); font-size: .72em; font-weight: 600; }
.netdot { width: .65em; height: .65em; border-radius: 50%; background: var(--line2); display: inline-block; }
.netdot.up { background: var(--green); }
.netdot.connecting { background: var(--amber); }
.hmain { padding: .6em 2.4em 1em; min-height: 0; overflow: hidden; position: relative; }
.h-title { font-size: 3.1em; line-height: 1.12; font-weight: 800; letter-spacing: -.035em; margin: .25em 0 .2em; }
.h-title.sm { font-size: 2.4em; }
.h-sub { font-size: 1.2em; color: var(--ink2); margin: 0; line-height: 1.5; font-weight: 500; }
.hrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 1.2em; }
.stack { display: flex; flex-direction: column; gap: 1em; }

.hbar { display: flex; align-items: center; gap: .8em; padding: .8em 2.4em 1.2em; }
.hbar .status { flex: 1; min-width: 0; display: flex; align-items: center; gap: .8em; color: var(--ink2); font-size: .9em; font-weight: 500; }
.hbtn { border: 1px solid var(--line2); background: var(--card); border-radius: 14px; padding: .65em 1.1em; font-size: .9em; font-weight: 600; color: var(--ink2); white-space: nowrap; }
.hbtn:hover { border-color: var(--ink3); }
.hbtn.primary { background: var(--ink); color: #fff; border-color: var(--ink); padding: .7em 1.5em; font-size: 1em; font-weight: 700; }
.hbtn.primary:hover { background: #000; }
.hbtn.primary.soft { background: var(--card); color: var(--ink); border-color: var(--ink); }
.hbtn.primary.pulse { animation: pulse 1.4s infinite; }
.hbtn.icon { padding: .65em .8em; }
.hbtn:disabled { opacity: .45; }
.kbd { font-size: .72em; color: var(--ink3); border: 1px solid var(--line2); border-radius: 6px; padding: .05em .4em; margin-left: .5em; font-weight: 600; }

/* 대기실 */
.lobby { display: grid; grid-template-columns: 1.25fr 1fr; gap: 2.4em; height: 100%; align-items: center; }
.lobby-right { padding: 1.6em; display: flex; flex-direction: column; align-items: center; gap: .8em; }
.qr svg { width: 100%; height: 100%; display: block; }
.qr { background: #fff; border-radius: 10px; }
.url { font-size: .78em; color: var(--ink3); word-break: break-all; text-align: center; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: .6em; margin-top: 1.6em; }
.chip { position: relative; display: inline-flex; align-items: center; gap: .45em; padding: .5em 1em .5em .6em; border-radius: 999px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); font-weight: 700; font-size: 1.05em; }
.chip .av { font-size: 1.35em; line-height: 1; display: inline-block; }
.chip .av.waving { animation: bounce .8s ease-out; }
.chip .hand { position: absolute; top: -.9em; right: -.3em; font-size: 1.2em; animation: wave .9s ease-in-out 2; transform-origin: 70% 80%; }
.chip.off { opacity: .45; }
.chip .x { display: none; position: absolute; top: -.45em; right: -.45em; width: 1.4em; height: 1.4em; border-radius: 50%; border: 1px solid var(--line2); background: #fff; font-size: .75em; line-height: 1; padding: 0; color: var(--ink3); }
.chip:hover .x { display: grid; place-items: center; }
.chip .vtag { font-size: .62em; color: var(--ink3); font-weight: 600; }
.bigcount { font-size: 1.4em; font-weight: 800; }
.empty-note { color: var(--ink3); font-size: 1.05em; margin-top: 1.6em; }

/* 보상표 */
.payoff { border-collapse: separate; border-spacing: .5em; font-size: 1em; }
.payoff th { font-weight: 600; color: var(--ink2); font-size: .85em; padding: .4em .6em; }
.payoff td { background: var(--gray-soft); border-radius: 14px; padding: .8em 1.2em; text-align: center; min-width: 8em; }
.payoff td.cc { background: var(--green-soft); }
.payoff td .v { font-size: 1.5em; font-weight: 800; letter-spacing: -.02em; }
.payoff td .s { font-size: .72em; color: var(--ink3); margin-top: .2em; }
.v .g { color: var(--green); }
.v .r { color: var(--red); }
.v .n { color: var(--gray); }

/* 대결 1: 짝 카드 */
.pairs { display: grid; grid-template-columns: repeat(auto-fit, minmax(15em, 1fr)); gap: 1.1em; margin-top: 1.4em; }
.pair { padding: 1.2em 1.1em; display: flex; flex-direction: column; gap: .9em; align-items: stretch; transition: border-color .3s, background .3s; }
.pair .seats { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .6em; }
.seat { display: flex; flex-direction: column; align-items: center; gap: .3em; min-width: 0; }
.seat .face { width: 3.2em; height: 3.2em; border-radius: 50%; display: grid; place-items: center; font-size: 1.6em; background: var(--gray-soft); position: relative; }
.seat .face.q { color: var(--ink3); font-weight: 800; }
.seat .nm { font-size: .82em; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .face.done { background: var(--green-soft); box-shadow: inset 0 0 0 3px var(--green); color: var(--green); }
.seat .ok { position: absolute; right: -.1em; bottom: -.1em; width: 1.9em; height: 1.9em; border-radius: 50%; background: var(--green); color: #fff; font-size: .42em; font-weight: 900; display: grid; place-items: center; border: 2px solid #fff; }
.seat .chosen { font-size: .7em; font-weight: 700; color: var(--tone); }
.vs { font-size: .8em; font-weight: 800; color: var(--ink3); }
.pair .label { text-align: center; font-weight: 800; font-size: 1.05em; color: var(--tone, var(--ink2)); background: var(--tone-soft, var(--gray-soft)); border-radius: 12px; padding: .45em .6em; }
.pair.revealed { border-color: var(--tone); }
.pair .tag { font-size: .72em; color: var(--ink3); font-weight: 600; text-align: center; }

.ring { position: relative; display: inline-grid; place-items: center; }
.ring svg { transform: rotate(-90deg); }
.ring .t { position: absolute; font-weight: 800; font-size: 1.15em; }
.progress-big { font-size: 2.2em; font-weight: 800; letter-spacing: -.03em; }
.progress-big small { font-size: .45em; color: var(--ink3); font-weight: 600; margin-left: .3em; }

.statline { display: flex; align-items: center; gap: 1em; margin-top: 1.2em; font-size: 1.1em; font-weight: 700; }
.meter { flex: 0 0 18em; height: .7em; background: var(--gray-soft); border-radius: 99px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--green); border-radius: 99px; transform-origin: left; animation: grow .7s ease-out both; }

/* 결과 차트 */
.compare { display: grid; grid-template-columns: 1fr 1.1fr; gap: 1.6em; margin-top: 1.4em; align-items: stretch; }
.cbox { padding: 1.4em 1.6em; }
.cbox h4 { margin: 0 0 1em; font-size: .9em; color: var(--ink2); font-weight: 700; }
.hbars { display: flex; flex-direction: column; gap: 1.1em; }
.hbar-row { display: grid; grid-template-columns: 9.5em 1fr 4em; align-items: center; gap: .8em; font-weight: 700; }
.hbar-row .lab { font-size: .85em; color: var(--ink2); line-height: 1.3; }
.hbar-row .track { height: 1.6em; background: var(--gray-soft); border-radius: 10px; overflow: hidden; }
.hbar-row .fill { height: 100%; background: var(--tone, var(--rust)); border-radius: 10px; transform-origin: left; animation: grow .9s cubic-bezier(.2, .8, .2, 1) both; }
.hbar-row .val { font-size: 1.3em; font-weight: 800; text-align: right; letter-spacing: -.02em; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font); }
.legend { display: flex; gap: 1.2em; font-size: .78em; color: var(--ink2); font-weight: 600; margin-top: .6em; flex-wrap: wrap; }
.legend i { display: inline-block; width: .9em; height: .9em; border-radius: 3px; margin-right: .35em; vertical-align: -.1em; }
.headline { font-size: 2.3em; font-weight: 800; letter-spacing: -.03em; margin: .2em 0 0; line-height: 1.2; }

/* 대결 2: 알고리즘 상자 */
.algos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2em; margin-top: 1.6em; }
.algo { padding: 1.6em 1.2em; display: flex; flex-direction: column; align-items: center; gap: .8em; text-align: center; min-height: 15em; justify-content: center; }
.algo .orb { width: 5.6em; height: 5.6em; border-radius: 50%; border: 3px solid var(--tone); background: var(--tone-soft); display: grid; place-items: center; font-size: 1.5em; font-weight: 800; color: var(--tone); }
.algo .orb.small { width: 3.4em; height: 3.4em; font-size: 1.2em; }
.algo .an { font-weight: 800; font-size: 1.05em; }
.algo .en { font-size: .8em; color: var(--ink3); font-weight: 600; letter-spacing: .02em; }
.algo .desc { font-size: .9em; color: var(--ink2); line-height: 1.45; }
.algo .stats { display: flex; gap: .6em; flex-wrap: wrap; justify-content: center; }
.algo.compact { min-height: 0; padding: 1em; flex-direction: row; gap: .9em; justify-content: flex-start; text-align: left; }
.progress-table { margin-top: 1.4em; display: grid; grid-template-columns: repeat(2, 1fr); gap: .5em 2em; }
.prow { display: grid; grid-template-columns: 2em 7.5em 1fr 2em; align-items: center; gap: .6em; padding: .45em .2em; border-bottom: 1px solid var(--line); font-weight: 600; }
.prow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pdots { display: flex; gap: .7em; }
.pdots .grp { display: flex; gap: .2em; }
.pdots i { width: .62em; height: .62em; border-radius: 50%; background: var(--line); display: inline-block; }
.pdots i.on { background: var(--tone); }

.tourney { display: grid; grid-template-columns: 1.3fr 1fr; gap: 1.6em; margin-top: 1.2em; }
.games { display: grid; grid-template-columns: 1fr 1fr; gap: .5em; font-size: .82em; }
.game { display: flex; justify-content: space-between; gap: .6em; padding: .55em .8em; border-radius: 10px; background: var(--gray-soft); font-weight: 600; }
.game.on { animation: fadeUp .35s ease-out both; }
.lane { padding: 1.1em 1.3em; margin-top: 1em; }
.lane h4 { margin: 0 0 .7em; font-size: .95em; display: flex; justify-content: space-between; }
.moves { display: grid; grid-template-columns: 4.5em repeat(10, 1fr); gap: .35em; align-items: center; }
.mv { height: 2.1em; border-radius: 8px; display: grid; place-items: center; font-size: .9em; font-weight: 800; position: relative; }
.mv.C { background: var(--green-soft); color: var(--green); }
.mv.D { background: var(--red-soft); color: var(--red); }
.mv.hide { opacity: 0; }
.mv .mk { position: absolute; top: -.85em; font-size: .85em; }
.mvlab { font-size: .75em; color: var(--ink2); font-weight: 700; }

/* 공공재 */
.rules { display: grid; grid-template-columns: repeat(4, 1fr); gap: .9em; margin-top: 1.4em; }
.rule { padding: 1.2em 1.1em; display: flex; flex-direction: column; gap: .5em; }
.rule .ic { font-size: 2em; }
.rule .t { font-weight: 800; font-size: 1.05em; }
.rule .d { font-size: .85em; color: var(--ink2); line-height: 1.45; }
.masks { display: flex; gap: .6em; flex-wrap: wrap; margin-top: 1.2em; align-items: center; }
.mask { width: 3.4em; height: 3.4em; border-radius: 18px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font-size: 1.7em; position: relative; box-shadow: var(--shadow); }
.mask .ok { position: absolute; right: -.2em; bottom: -.2em; width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--green); color: #fff; font-size: .36em; font-weight: 900; display: grid; place-items: center; border: 2px solid #fff; }
.mask.wait { opacity: .45; border-style: dashed; box-shadow: none; }
.mask.done { box-shadow: inset 0 0 0 3px var(--green), var(--shadow); }
.masks.big { font-size: 1.4em; }
.gauge { padding: 1em 1.3em 1.9em; min-width: 18em; }
.gauge .gt { display: flex; justify-content: space-between; font-weight: 700; font-size: .85em; color: var(--ink2); margin-bottom: .5em; }
.gauge .gtrack { position: relative; height: 1.1em; background: var(--gray-soft); border-radius: 99px; overflow: visible; }
.gauge .gfill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #E9A27E, var(--rust)); transition: width 1s ease; }
.gauge .gmark { position: absolute; top: -.35em; bottom: -.35em; width: 2px; background: var(--ink); }
.gauge .gmark span { position: absolute; top: calc(100% + .35em); left: 50%; transform: translateX(-50%); font-size: .68em; font-weight: 700; white-space: nowrap; color: var(--ink2); }
.potline { display: flex; align-items: baseline; gap: .5em; flex-wrap: wrap; font-weight: 800; font-size: 2.2em; letter-spacing: -.03em; margin-top: .6em; }
.potline .op { color: var(--ink3); font-weight: 600; font-size: .7em; }
.potline .hl { color: var(--rust); }
.cbars { display: flex; gap: 1em; align-items: flex-end; height: 15em; margin-top: 1.2em; padding: 0 .4em; }
.cbar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: .4em; height: 100%; justify-content: flex-end; min-width: 0; }
.cbar .col { width: 100%; max-width: 4.6em; background: var(--rust); border-radius: 10px 10px 4px 4px; transform-origin: bottom; animation: rise .8s cubic-bezier(.2, .8, .2, 1) both; min-height: 4px; }
.cbar .col.zero { background: var(--line2); }
.cbar .cv { font-weight: 800; font-size: 1.15em; }
.cbar .ce { font-size: 1.9em; line-height: 1; }
.cbar .hits { font-size: 1.1em; font-weight: 800; color: var(--red); min-height: 1.3em; white-space: nowrap; }
.hits-anim { animation: shake .6s ease-in-out .2s both; }
.surprise { display: grid; place-items: center; text-align: center; height: 100%; gap: .4em; }
.surprise .gift { font-size: 7em; line-height: 1; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

/* 최종 */
.finals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2em; margin-top: 1.4em; }
.fbox { padding: 1.3em 1.4em; display: flex; flex-direction: column; gap: .9em; }
.fbox h4 { margin: 0; font-size: 1em; }
.fbox .q { color: var(--ink3); font-size: .8em; font-weight: 600; }
.vbars { display: flex; gap: .9em; align-items: flex-end; height: 11em; }
.vbar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: .35em; height: 100%; }
.vbar .col { width: 100%; max-width: 4em; border-radius: 10px 10px 4px 4px; background: var(--tone, var(--rust)); transform-origin: bottom; animation: rise .9s cubic-bezier(.2, .8, .2, 1) both; min-height: 4px; }
.vbar .vv { font-weight: 800; font-size: 1.15em; }
.vbar .vl { font-size: .72em; color: var(--ink2); font-weight: 600; text-align: center; line-height: 1.3; min-height: 2.6em; }

/* 오버레이 */
.overlay { position: fixed; inset: 0; background: rgba(247, 244, 238, .92); backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 40; }
.modal { width: min(64em, 92vw); max-height: 88vh; overflow: auto; padding: 1.6em 1.8em; font-size: 15px; }
.modal h3 { margin: 0 0 .8em; font-size: 1.3em; }
.modal h5 { margin: 1.4em 0 .6em; font-size: .95em; color: var(--rust); }
.srow { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: .55em 0; border-bottom: 1px solid var(--line); }
.srow label { font-weight: 600; font-size: .95em; }
.srow .hint { font-size: .78em; color: var(--ink3); display: block; font-weight: 500; }
.srow input[type=number] { width: 5em; padding: .4em .5em; border: 1px solid var(--line2); border-radius: 8px; font-size: .95em; text-align: right; }
.srow select { padding: .4em .5em; border: 1px solid var(--line2); border-radius: 8px; font-size: .95em; font-family: inherit; background: #fff; }
.btnrow { display: flex; gap: .5em; flex-wrap: wrap; }
.qrbig { display: flex; flex-direction: column; align-items: center; gap: 1em; }
.toast { position: fixed; left: 50%; bottom: 6em; transform: translateX(-50%); background: var(--ink); color: #fff; padding: .7em 1.2em; border-radius: 12px; font-weight: 600; z-index: 60; animation: fadeUp .3s ease-out both; }
.resume { padding: 2em 2.2em; width: min(34em, 92vw); font-size: 16px; display: flex; flex-direction: column; gap: 1em; }
.resume h3 { margin: 0; font-size: 1.4em; }
.pausebadge { color: var(--amber); font-weight: 700; }

/* ---------- 학생 화면 (휴대폰) ---------- */
.ph { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 16px calc(16px + env(safe-area-inset-bottom)); font-size: 16px; }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 2px 10px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.me { display: flex; align-items: center; gap: 8px; font-weight: 700; min-width: 0; }
.me .av { font-size: 24px; }
.me .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 9em; }
.pbody { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-top: 4px; }
.ptitle { font-size: 25px; font-weight: 800; letter-spacing: -.03em; line-height: 1.25; margin: 4px 0 0; }
.psub { color: var(--ink2); font-size: 15px; line-height: 1.55; margin: 0; }
.pcard { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
.center { text-align: center; }
.bigemoji { font-size: 64px; line-height: 1; }
.pbtn { width: 100%; border: none; border-radius: 16px; padding: 16px; font-size: 17px; font-weight: 700; background: var(--ink); color: #fff; }
.pbtn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line2); }
.pbtn.rust { background: var(--rust); }
.pbtn:disabled { opacity: .45; }
.pinput { width: 100%; padding: 15px 14px; border-radius: 14px; border: 1.5px solid var(--line2); font-size: 18px; font-weight: 600; background: #fff; outline: none; }
.pinput:focus { border-color: var(--rust); }
.inrow { display: flex; gap: 8px; }
.dice { flex: 0 0 56px; border-radius: 14px; border: 1.5px solid var(--line2); background: #fff; font-size: 24px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice { border: 2px solid transparent; border-radius: 22px; padding: 22px 10px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: var(--tone-soft); color: var(--tone); font-weight: 800; transition: transform .12s, border-color .2s, opacity .2s; }
.choice .e { font-size: 46px; line-height: 1.05; }
.choice .l { font-size: 20px; }
.choice .s { font-size: 12px; color: var(--ink2); font-weight: 600; line-height: 1.4; }
.choice:active { transform: scale(.97); }
.choice.sel { border-color: var(--tone); }
.choice.dim { opacity: .35; }
.partner { display: flex; align-items: center; gap: 12px; }
.partner .face { width: 50px; height: 50px; border-radius: 50%; background: var(--gray-soft); display: grid; place-items: center; font-size: 26px; flex: 0 0 auto; font-weight: 800; color: var(--ink3); }
.partner .who { font-weight: 800; font-size: 17px; }
.partner .note { font-size: 13px; color: var(--ink3); font-weight: 600; margin-top: 2px; }
.result { border-radius: 22px; padding: 22px 18px; text-align: center; background: var(--tone-soft); }
.result .e { font-size: 58px; line-height: 1.1; }
.result .t { font-size: 23px; font-weight: 800; color: var(--tone); margin-top: 6px; }
.result .pts { font-size: 40px; font-weight: 900; letter-spacing: -.03em; margin-top: 4px; color: var(--tone); }
.result .d { font-size: 14px; color: var(--ink2); margin-top: 4px; font-weight: 600; }
.hist { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.hist .h { display: inline-flex; gap: 1px; padding: 4px 7px; border-radius: 9px; background: var(--card); border: 1px solid var(--line); font-size: 14px; }
.scorechip { font-weight: 800; font-size: 14px; padding: 6px 11px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); white-space: nowrap; }
.banner { background: var(--amber-soft); color: #8A5A1A; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.paytable { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 13px; }
.paytable th { color: var(--ink3); font-weight: 600; }
.paytable td { background: var(--gray-soft); border-radius: 8px; text-align: center; padding: 6px 2px; font-weight: 800; }
.paytable td.cc { background: var(--green-soft); }
details.pay summary { cursor: pointer; color: var(--ink3); font-size: 13px; font-weight: 600; list-style: none; }
details.pay summary::-webkit-details-marker { display: none; }
.foot { text-align: center; font-size: 12px; color: var(--ink3); padding-top: 14px; }
.orbp { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--tone); background: var(--tone-soft); display: grid; place-items: center; font-size: 26px; font-weight: 800; color: var(--tone); flex: 0 0 auto; }
.botrow { display: flex; align-items: center; gap: 14px; }
.steps { display: flex; gap: 5px; }
.steps i { width: 9px; height: 9px; border-radius: 50%; background: var(--line2); }
.steps i.on { background: var(--tone, var(--rust)); }
.guess { display: flex; flex-direction: column; gap: 10px; }
.gopts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gopt { border: 1.5px solid var(--line2); background: #fff; border-radius: 14px; padding: 11px 8px; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.gopt.sel { border-color: var(--rust); background: var(--rust-soft); color: var(--rust-ink); }
.stepper { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 10px; }
.stepper button { height: 64px; border-radius: 18px; border: 1.5px solid var(--line2); background: #fff; font-size: 30px; font-weight: 700; }
.stepper .val { text-align: center; font-size: 54px; font-weight: 900; letter-spacing: -.04em; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick button { border: 1.5px solid var(--line2); background: #fff; border-radius: 12px; padding: 10px 0; font-weight: 700; font-size: 15px; }
.split { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; color: var(--ink2); }
.split b { color: var(--ink); }
.prow2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.prow2:last-child { border-bottom: none; }
.prow2 .who { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.prow2 .who .e { font-size: 26px; }
.prow2 .cc { font-size: 13px; color: var(--ink3); font-weight: 600; }
.mini { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; gap: 6px; }
.mini button { height: 38px; border-radius: 11px; border: 1.5px solid var(--line2); background: #fff; font-size: 20px; font-weight: 700; padding: 0; }
.mini .k { text-align: center; font-weight: 800; font-size: 17px; min-width: 2.4em; }
.rowbars { display: flex; flex-direction: column; gap: 6px; }
.rb { display: grid; grid-template-columns: 30px 1fr 52px; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
.rb .tr { height: 12px; background: var(--gray-soft); border-radius: 99px; overflow: hidden; }
.rb .fl { height: 100%; background: var(--rust); border-radius: 99px; transform-origin: left; animation: grow .7s ease-out both; }
.rb.me .fl { background: var(--ink); }
.rb.me { color: var(--ink); }
.tag-me { font-size: 11px; background: var(--ink); color: #fff; border-radius: 6px; padding: 1px 5px; margin-left: 4px; }
.mask-me { width: 96px; height: 96px; border-radius: 28px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font-size: 56px; margin: 0 auto; box-shadow: var(--shadow); }
.kv { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--line2); font-weight: 600; font-size: 15px; }
.kv:last-child { border-bottom: none; }
.kv b { font-weight: 800; }
.netmini { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink3); font-weight: 600; }
.timer { font-weight: 800; font-size: 14px; color: var(--ink2); display: inline-flex; gap: 6px; align-items: center; }
.timer.low { color: var(--red); }
.wavebtn { border: 1.5px solid var(--line2); background: #fff; border-radius: 99px; padding: 12px 20px; font-size: 16px; font-weight: 700; }
.wavebtn .h { display: inline-block; transform-origin: 70% 80%; }
.wavebtn:active .h { animation: wave .6s; }

@media (max-width: 360px) {
  .ptitle { font-size: 22px; }
  .choice .e { font-size: 40px; }
  .stepper .val { font-size: 46px; }
}
.hbtn.primary .kbd { color: rgba(255, 255, 255, .65); border-color: rgba(255, 255, 255, .3); }
.hbtn.primary.soft .kbd { color: var(--ink3); border-color: var(--line2); }

.payoff-wrap { margin-top: .6em; font-size: 1.25em; }
.delta { margin-top: 1.4em; font-size: 2.2em; font-weight: 800; letter-spacing: -.03em; color: var(--ink2); }
.delta.up { color: var(--green); }
.delta.down { color: var(--red); }
.linkbtn { background: none; border: none; color: var(--ink3); font-size: 13px; font-weight: 600; text-decoration: underline; padding: 4px; }

</style>

    if (r === 2) { a = 'D'; aMark = 'err'; }
    if (generous && r === 4 && b === 'D') { b = 'C'; bMark = 'forgive'; }
    if (generous && r === 4 && a === 'D') { a = 'C'; aMark = 'forgive'; }
    A.push({ m: a, mark: aMark });
    B.push({ m: b, mark: bMark });
  }
  let sa = 0, sb = 0;
  for (let r = 0; r < rounds; r++) {
    const [pa, pb] = pdPay(A[r].m, B[r].m);
    sa += pa; sb += pb;
  }
  return { A, B, sa, sb };
}

const ANIMALS = [
  ['🦊', '여우'], ['🐼', '판다'], ['🐸', '개구리'], ['🐧', '펭귄'], ['🦁', '사자'], ['🐨', '코알라'],
  ['🐯', '호랑이'], ['🐰', '토끼'], ['🐻', '곰'], ['🦉', '부엉이'], ['🐙', '문어'], ['🦄', '유니콘'],
  ['🐳', '고래'], ['🐿️', '다람쥐'], ['🦔', '고슴도치'], ['🐢', '거북이'],
];

/* ---------- 4. 통신 (공개 MQTT 여러 곳 동시 / 로컬 리허설) ---------- */
function createNet({ local, brokers }) {
  const subs = new Map(); // topic -> Set(cb)
  const statusListeners = new Set();
  const status = {};
  const emitStatus = () => statusListeners.forEach((f) => f({ ...status }));
  const deliver = (topic, data, meta) => {
    const set = subs.get(topic);
    if (set) set.forEach((cb) => { try { cb(data, meta); } catch (e) { console.error(e); } });
  };

  if (local) {
    const bc = new BroadcastChannel('tg-local-' + CONFIG.ROOM);
    const RET = 'tgret:';
    bc.onmessage = (e) => {
      const { topic, data } = e.data || {};
      if (topic) deliver(topic, data, { broker: 'local' });
    };
    status.local = 'up';
    setTimeout(emitStatus, 0);
    return {
      local: true,
      onStatus(f) { statusListeners.add(f); f({ ...status }); return () => statusListeners.delete(f); },
      upCount: () => 1,
      publish(topic, data, retain) {
        if (retain) {
          if (data === null) localStorage.removeItem(RET + topic);
          else localStorage.setItem(RET + topic, JSON.stringify(data));
        }
        if (data !== null) bc.postMessage({ topic, data });
      },
      subscribe(topic, cb) {
        if (!subs.has(topic)) subs.set(topic, new Set());
        subs.get(topic).add(cb);
        const raw = localStorage.getItem(RET + topic);
        if (raw) setTimeout(() => { try { cb(JSON.parse(raw), { broker: 'local', retained: true }); } catch (e) {} }, 0);
        return () => subs.get(topic).delete(cb);
      },
      onReconnect() {},
    };
  }

  const clients = [];
  const reconnectListeners = new Set();
  brokers.forEach((b) => {
    status[b.name] = 'connecting';
    let client;
    try {
      client = mqtt.connect(b.url, {
        clientId: 'tg_' + uid(12),
        protocolVersion: 4,
        clean: true,
        keepalive: 45,
        reconnectPeriod: 2500,
        connectTimeout: 8000,
        resubscribe: true,
      });
    } catch (e) {
      status[b.name] = 'down';
      return;
    }
    clients.push({ b, client });
    client.on('connect', () => {
      status[b.name] = 'up';
      emitStatus();
      const topics = [...subs.keys()];
      if (topics.length) client.subscribe(topics, { qos: 1 });
      reconnectListeners.forEach((f) => f(b.name));
    });
    client.on('reconnect', () => { if (status[b.name] !== 'up') { status[b.name] = 'connecting'; emitStatus(); } });
    client.on('close', () => { status[b.name] = 'down'; emitStatus(); });
    client.on('offline', () => { status[b.name] = 'down'; emitStatus(); });
    client.on('error', () => {});
    client.on('message', (topic, payload, packet) => {
      if (!payload || !payload.length) return;
      let data;
      try { data = JSON.parse(new TextDecoder().decode(payload)); } catch (e) { return; }
      deliver(topic, data, { broker: b.name, retained: !!(packet && packet.retain) });
    });
  });
  setTimeout(emitStatus, 0);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      clients.forEach(({ client }) => { if (!client.connected && !client.reconnecting) { try { client.reconnect(); } catch (e) {} } });
    }
  });

  return {
    local: false,
    onStatus(f) { statusListeners.add(f); f({ ...status }); return () => statusListeners.delete(f); },
    upCount: () => clients.filter(({ client }) => client.connected).length,
    publish(topic, data, retain) {
      const str = data === null ? '' : JSON.stringify(data);
      clients.forEach(({ client }) => {
        if (client.connected) client.publish(topic, str, { qos: 1, retain: !!retain });
      });
    },
    subscribe(topic, cb) {
      const isNew = !subs.has(topic);
      if (isNew) subs.set(topic, new Set());
      subs.get(topic).add(cb);
      if (isNew) clients.forEach(({ client }) => { if (client.connected) client.subscribe(topic, { qos: 1 }); });
      return () => subs.get(topic).delete(cb);
    },
    onReconnect(f) { reconnectListeners.add(f); return () => reconnectListeners.delete(f); },
  };
}

// 탭이 가려져도 덜 느려지는 타이머 (워커에서 박자만 받는다)
function workerInterval(fn, ms) {
  try {
    const blob = new Blob([`setInterval(function(){postMessage(0)},${ms});`], { type: 'text/javascript' });
    const w = new Worker(URL.createObjectURL(blob));
    w.onmessage = () => { try { fn(); } catch (e) { console.error(e); } };
    return w;
  } catch (e) {
    return setInterval(fn, ms);
  }
}

function readParams() {
  const q = new URLSearchParams(location.search);
  const room = (q.get('r') || CONFIG.ROOM).replace(/[^a-z0-9_-]/gi, '').slice(0, 40) || CONFIG.ROOM;
  const brokerOverride = q.get('broker');
  const brokers = brokerOverride ? [{ name: 'custom', url: brokerOverride }] : CONFIG.BROKERS;
  return {
    q,
    room,
    isHost: q.has('host'),
    hostPin: q.get('host'),
    local: q.get('local') === '1',
    brokerOverride,
    brokers,
    base: `${CONFIG.TOPIC_PREFIX}/${room}`,
  };
}

function joinUrl(params) {
  const u = new URL(location.href);
  u.search = '';
  u.hash = '';
  if (params.room !== CONFIG.ROOM) u.searchParams.set('r', params.room);
  if (params.local) u.searchParams.set('local', '1');
  if (params.brokerOverride) u.searchParams.set('broker', params.brokerOverride);
  return u.toString();
}

/* ---- host.js ---- */
/* =====================================================================
 * 진행자(호스트) — 모든 점수 계산과 진행 상태를 이 화면이 가진다
 * ===================================================================== */
function createHost(params, net) {
  const STORE_KEY = `tg:host:${params.room}${params.local ? ':local' : ''}`;
  const T = (name) => `${params.base}/${name}`;
  const listeners = new Set();
  let S = null;
  let resumePrompt = null;
  const seen = {}; // pid -> 마지막 신호 시각 (저장 안 함)
  const processed = new Set(); // 처리한 action id
  const processedQ = [];
  const acks = {}; // pid -> 최근 처리한 aid 목록
  const lastPub = new Map();
  const vq = []; // 가상 참가자 예약 행동
  const vqKeys = new Set();
  let ui = { qr: false, settings: false, toast: null };
  const inst = uid(8); // 이 진행자 화면(탭) 고유 번호
  let passive = false; // 다른 진행자 화면에 진행을 넘긴 상태
  let ready = false; // 켜자마자 바로 방송하지 않고, 이미 진행 중인 화면이 있는지 먼저 듣는다
  let lastAssert = 0;

  /* ---------- 상태 생성·저장 ---------- */
  function freshState(settings) {
    return {
      schema: 1,
      sid: uid(8),
      seq: 1,
      createdAt: now(),
      settings: { ...DEFAULTS, ...(settings || {}) },
      players: {},
      order: [],
      stage: 'lobby',
      pd: null,
      bots: null,
      pgg: null,
      log: [],
      paused: false,
    };
  }
  function loadSaved() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || s.schema !== 1) return null;
      s.settings = { ...DEFAULTS, ...s.settings };
      return s;
    } catch (e) {
      return null;
    }
  }
  let saveTimer = null;
  function persistNow() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    if (!S) return;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
  }
  function persist() {
    // 화면이 가려져 있으면(캔바 슬라이드를 띄운 동안) 타이머가 늦게 돌 수 있어 바로 저장한다
    if (document.hidden) { persistNow(); return; }
    if (saveTimer) return;
    saveTimer = setTimeout(persistNow, 250);
  }
  addEventListener('pagehide', persistNow);
  addEventListener('beforeunload', persistNow);
  document.addEventListener('visibilitychange', () => { if (document.hidden) persistNow(); });

  /* ---------- 공통 ---------- */
  const set = () => S.settings;
  const P = (pid) => S.players[pid];
  const activePids = () => S.order.filter((pid) => P(pid) && !P(pid).kicked);
  const humanName = (pid) => (pid === BOT ? '알고리즘' : (P(pid) && P(pid).name) || '?');

  function changed() {
    persist();
    scheduleFlush();
    scheduleVirtual();
    listeners.forEach((f) => f());
  }
  function notify() { listeners.forEach((f) => f()); }
  function toast(msg) {
    ui.toast = { msg, at: now() };
    notify();
    setTimeout(() => { if (ui.toast && now() - ui.toast.at > 2400) { ui.toast = null; notify(); } }, 2600);
  }
  function addLog(row) {
    S.log.push({ t: new Date().toISOString(), ...row });
  }

  /* ---------- 참가자 ---------- */
  function addPlayer(pid, name, avatar, virtual) {
    const clean = String(name || '').replace(/\s+/g, ' ').trim().slice(0, 10) || randomNick();
    const used = new Set(Object.values(S.players).map((p) => p.avatar));
    let av = AVATARS.includes(avatar) && !used.has(avatar) ? avatar : AVATARS.find((a) => !used.has(a)) || AVATARS[S.order.length % AVATARS.length];
    if (S.players[pid]) {
      const p = S.players[pid];
      if (p.kicked) return;
      p.name = clean;
      return;
    }
    S.players[pid] = { pid, name: clean, avatar: av, joinedAt: now(), kicked: false, virtual: !!virtual, wave: 0, n: S.order.length + 1 };
    S.order.push(pid);
    seen[pid] = now();
    // 진행 중에 들어온 사람 처리
    if (S.stage === 'bots' && S.bots && S.bots.phase === 'play') ensureBotProg(pid);
    if (S.stage === 'pgg' && S.pgg) assignAlias(pid);
  }

  function kick(pid) {
    const p = P(pid);
    if (!p) return;
    p.kicked = true;
    // 진행 중인 결정은 기본값으로 채워지도록 둔다
    if (S.stage === 'pd' && S.pd && S.pd.phase === 'choose') maybeRevealPD();
    if (S.stage === 'pgg' && S.pgg && S.pgg.phase === 'contrib') maybeRevealContrib();
    if (S.stage === 'pgg' && S.pgg && S.pgg.phase === 'punish') maybeRevealPunish();
    changed();
  }

  function addVirtual(n) {
    for (let i = 0; i < n; i++) addPlayer('v_' + uid(6), randomNick(), null, true);
    changed();
  }

  /* ---------- 대결 1 · 사람 vs 사람 ---------- */
  const pdPart = () => S.pd.parts[S.pd.cur];

  function startPD() {
    S.stage = 'pd';
    S.pd = { cur: 1, phase: 'intro', round: 0, parts: {}, met: [], botFaced: [], deadline: null, nextAt: null };
    setupPDPart(1);
  }
  function setupPDPart(k) {
    const members = activePids();
    const rounds = k === 1 ? set().pd1Rounds : set().pd2Rounds;
    const mode = k === 1 ? set().pd1Mode : 'fixed';
    let schedule;
    if (k === 1) {
      const ms = matchings(shuffle(members));
      schedule = range(rounds).map((r) => (mode === 'stranger' ? ms[r % ms.length] : ms[0]));
    } else {
      const m = bestMatching(members, S.pd.met, S.pd.botFaced);
      schedule = range(rounds).map(() => m);
    }
    S.pd.parts[k] = {
      k, rounds, mode, named: k === 2 && !!set().pd2Named, members, schedule,
      choices: [], forced: [], outcomes: [], coop: [], scores: Object.fromEntries(members.map((p) => [p, 0])),
    };
    S.pd.cur = k;
    S.pd.phase = 'intro';
    S.pd.round = 0;
    S.pd.deadline = null;
    S.pd.nextAt = null;
  }
  function pdStartRound() {
    const part = pdPart();
    part.choices[S.pd.round] = {};
    part.forced[S.pd.round] = {};
    S.pd.phase = 'choose';
    S.pd.deadline = set().pdTimer ? now() + set().pdTimer * 1000 : null;
    S.pd.nextAt = null;
  }
  function pdPending() {
    const part = pdPart();
    const ch = part.choices[S.pd.round] || {};
    return part.members.filter((pid) => !(pid in ch) && P(pid) && !P(pid).kicked);
  }
  function pdChoose(pid, k, r, c) {
    if (S.stage !== 'pd' || S.pd.phase !== 'choose' || S.pd.cur !== k || S.pd.round !== r) return;
    const part = pdPart();
    if (!part.members.includes(pid) || (c !== 'C' && c !== 'D')) return;
    const ch = part.choices[r];
    if (pid in ch) return;
    ch[pid] = c;
    maybeRevealPD();
  }
  function maybeRevealPD() {
    if (S.pd.phase === 'choose' && pdPending().length === 0) pdReveal();
  }
  function botMovePD(part, r, partner) {
    if (r === 0) return 'C';
    const prev = (part.outcomes[r - 1] || []).find((o) => (o.a === BOT && o.b === partner) || (o.b === BOT && o.a === partner));
    if (!prev) return 'C'; // 새로 만난 상대에게는 협력부터 (팃포탯)
    return prev.a === partner ? prev.ca : prev.cb;
  }
  function pdReveal() {
    const part = pdPart();
    const r = S.pd.round;
    const ch = part.choices[r];
    part.members.forEach((pid) => {
      if (!(pid in ch)) { ch[pid] = 'C'; part.forced[r][pid] = true; }
    });
    const outcomes = [];
    let coopN = 0, humanN = 0;
    for (const [a, b] of part.schedule[r]) {
      const ca = a === BOT ? botMovePD(part, r, b) : ch[a];
      const cb = b === BOT ? botMovePD(part, r, a) : ch[b];
      const [pa, pb] = pdPay(ca, cb);
      outcomes.push({ a, b, ca, cb, pa, pb });
      [[a, ca, pa, b, cb], [b, cb, pb, a, ca]].forEach(([me, mc, mp, ot, oc]) => {
        if (me === BOT) return;
        part.scores[me] = (part.scores[me] || 0) + mp;
        humanN++;
        if (mc === 'C') coopN++;
        addLog({ stage: '대결1', part: part.k === 1 ? '1차' : '2차', round: r + 1, player: humanName(me), choice: mc === 'C' ? '협력' : '배신', other: ot === BOT ? '알고리즘' : (part.named ? humanName(ot) : '익명'), otherChoice: oc === 'C' ? '협력' : '배신', payoff: mp, forced: part.forced[r][me] ? 'Y' : '' });
      });
      if (part.k === 1) {
        if (a === BOT) S.pd.botFaced.push(b);
        else if (b === BOT) S.pd.botFaced.push(a);
        else S.pd.met.push(pairKey(a, b));
      }
    }
    part.outcomes[r] = outcomes;
    part.coop[r] = humanN ? coopN / humanN : 0;
    S.pd.phase = 'reveal';
    S.pd.deadline = null;
    const last = r >= part.rounds - 1;
    S.pd.nextAt = set().autoNext && !last && !S.paused ? now() + set().pdNextDelay * 1000 : null;
  }
  function pdNext() {
    const part = pdPart();
    if (S.pd.round < part.rounds - 1) {
      S.pd.round++;
      pdStartRound();
    } else {
      S.pd.phase = 'end';
      S.pd.nextAt = null;
    }
  }

  /* ---------- 대결 2 · 알고리즘 ---------- */
  function startBots() {
    S.stage = 'bots';
    S.bots = { phase: 'intro', rounds: set().botRounds, prog: {}, revealed: [false, false, false] };
  }
  function ensureBotProg(pid) {
    if (!S.bots.prog[pid]) S.bots.prog[pid] = { a: 0, hist: [[], [], []], score: [0, 0, 0], guess: null };
  }
  function botsPlay() {
    S.bots.phase = 'play';
    activePids().forEach(ensureBotProg);
  }
  function botChoose(pid, a, r, c) {
    if (S.stage !== 'bots' || S.bots.phase !== 'play') return;
    const p = S.bots.prog[pid];
    if (!p || p.a !== a || a > 2 || p.hist[a].length !== r || (c !== 'C' && c !== 'D')) return;
    const b = algoMove(ALGOS[a].key, p.hist[a]);
    const [pp] = pdPay(c, b);
    p.hist[a].push({ p: c, b, pay: pp });
    p.score[a] += pp;
    addLog({ stage: '대결2', part: '알고리즘' + ALGOS[a].no, round: r + 1, player: humanName(pid), choice: c === 'C' ? '협력' : '배신', other: ALGOS[a].name, otherChoice: b === 'C' ? '협력' : '배신', payoff: pp, forced: '' });
    if (p.hist[a].length >= S.bots.rounds) p.a = a + 1;
  }
  function botGuess(pid, guess) {
    if (S.stage !== 'bots') return;
    const p = S.bots.prog[pid];
    if (!p || p.a < 3 || p.guess) return;
    if (!Array.isArray(guess) || guess.length !== 3 || !guess.every((g) => GUESS_OPTS.some((o) => o.key === g))) return;
    p.guess = guess.slice();
    guess.forEach((g, i) => addLog({ stage: '대결2', part: '정체 맞히기', round: i + 1, player: humanName(pid), choice: g, other: ALGOS[i].key, otherChoice: '', payoff: g === ALGOS[i].key ? 1 : 0, forced: '' }));
  }
  function botStats() {
    const B = S.bots;
    if (!B) return null;
    const progs = Object.entries(B.prog).filter(([pid]) => P(pid) && !P(pid).kicked).map(([, p]) => p);
    return ALGOS.map((al, i) => {
      const moves = progs.flatMap((p) => p.hist[i]);
      const guessed = progs.filter((p) => p.guess);
      return {
        coop: moves.length ? moves.filter((m) => m.p === 'C').length / moves.length : null,
        moves: moves.length,
        correct: guessed.filter((p) => p.guess[i] === al.key).length,
        guessed: guessed.length,
        avgScore: progs.length ? avg(progs.filter((p) => p.hist[i].length).map((p) => p.score[i])) : 0,
      };
    });
  }

  /* ---------- 공공재 게임 ---------- */
  function startPGG() {
    S.stage = 'pgg';
    S.pgg = { phase: 'intro', part: 'A', round: 0, alias: {}, rounds: [], totals: {}, deadline: null, nextAt: null };
    const order = shuffle(range(ANIMALS.length));
    shuffle(activePids()).forEach((pid, i) => { S.pgg.alias[pid] = order[i % order.length]; });
  }
  function assignAlias(pid) {
    if (!S.pgg || pid in S.pgg.alias) return;
    const used = new Set(Object.values(S.pgg.alias));
    const free = shuffle(range(ANIMALS.length)).find((i) => !used.has(i));
    S.pgg.alias[pid] = free === undefined ? Math.floor(Math.random() * ANIMALS.length) : free;
  }
  const pggRound = () => S.pgg.rounds[S.pgg.rounds.length - 1];
  const pggLimit = () => (S.pgg.part === 'A' ? set().pggA : set().pggB);
  function pggStartRound() {
    activePids().forEach(assignAlias);
    const members = activePids();
    S.pgg.rounds.push({ part: S.pgg.part, idx: S.pgg.round, members, n: members.length, contrib: {}, forced: {}, punish: {}, pforced: {} });
    S.pgg.phase = 'contrib';
    S.pgg.deadline = set().pggTimer ? now() + set().pggTimer * 1000 : null;
    S.pgg.nextAt = null;
  }
  const pggPendingContrib = () => {
    const R = pggRound();
    return R.members.filter((pid) => !(pid in R.contrib) && P(pid) && !P(pid).kicked);
  };
  const pggPendingPunish = () => {
    const R = pggRound();
    return R.members.filter((pid) => !(pid in R.punish) && P(pid) && !P(pid).kicked);
  };
  function pggContrib(pid, gr, amount) {
    if (S.stage !== 'pgg' || S.pgg.phase !== 'contrib') return;
    const R = pggRound();
    if (S.pgg.rounds.length - 1 !== gr || !R.members.includes(pid) || pid in R.contrib) return;
    const a = Math.round(Number(amount));
    if (!Number.isFinite(a)) return;
    R.contrib[pid] = clamp(a, 0, set().pggEndow);
    maybeRevealContrib();
  }
  function maybeRevealContrib() {
    if (S.pgg.phase === 'contrib' && pggPendingContrib().length === 0) pggRevealContrib();
  }
  function pggRevealContrib() {
    const R = pggRound();
    R.members = R.members.filter((pid) => P(pid) && !P(pid).kicked);
    const E = set().pggEndow, m = set().pggMult;
    R.members.forEach((pid) => { if (!(pid in R.contrib)) { R.contrib[pid] = 0; R.forced[pid] = true; } });
    R.total = sum(R.members.map((p) => R.contrib[p]));
    R.pot = R.total * m;
    R.share = R.members.length ? R.pot / R.members.length : 0;
    R.base = Object.fromEntries(R.members.map((p) => [p, E - R.contrib[p] + R.share]));
    R.E = E;
    R.m = m;
    if (R.part === 'A') finishPGGRound(R, {}, {});
    S.pgg.phase = 'creveal';
    S.pgg.deadline = null;
    const lastA = R.part === 'A' && S.pgg.round >= pggLimit() - 1;
    S.pgg.nextAt = set().autoNext && !S.paused && !lastA ? now() + set().pggNextDelay * 1000 : null;
  }
  function finishPGGRound(R, recv, given) {
    R.recv = recv;
    R.given = given;
    R.pay = {};
    R.members.forEach((pid) => {
      const base = R.base[pid];
      const loss = Math.min(base, (recv[pid] || 0) * set().pggImpact);
      R.pay[pid] = Math.max(0, base - loss - (given[pid] || 0));
      S.pgg.totals[pid] = (S.pgg.totals[pid] || 0) + R.pay[pid];
      addLog({ stage: '공공재', part: R.part === 'A' ? 'A(처벌 없음)' : 'B(응징 가능)', round: R.idx + 1, player: humanName(pid), choice: R.contrib[pid], other: ANIMALS[S.pgg.alias[pid]][1], otherChoice: R.part === 'B' ? `받은👊${recv[pid] || 0}/쓴👊${given[pid] || 0}` : '', payoff: r1(R.pay[pid]), forced: R.forced[pid] ? 'Y' : '' });
    });
  }
  function pggStartPunish() {
    S.pgg.phase = 'punish';
    S.pgg.deadline = set().pggTimer ? now() + set().pggTimer * 1000 : null;
    S.pgg.nextAt = null;
  }
  function pggPunish(pid, gr, alloc) {
    if (S.stage !== 'pgg' || S.pgg.phase !== 'punish') return;
    const R = pggRound();
    if (S.pgg.rounds.length - 1 !== gr || !R.members.includes(pid) || pid in R.punish) return;
    const byAlias = {};
    R.members.forEach((p) => { byAlias[S.pgg.alias[p]] = p; });
    const out = {};
    let total = 0;
    Object.entries(alloc || {}).forEach(([ai, n]) => {
      const target = byAlias[ai];
      const k = clamp(Math.round(Number(n) || 0), 0, set().pggMaxPunish);
      if (!target || target === pid || !k) return;
      out[target] = k;
      total += k;
    });
    if (total > set().pggMaxPunish) return;
    R.punish[pid] = out;
    maybeRevealPunish();
  }
  function maybeRevealPunish() {
    if (S.pgg.phase === 'punish' && pggPendingPunish().length === 0) pggRevealPunish();
  }
  function pggRevealPunish() {
    const R = pggRound();
    R.members.forEach((pid) => { if (!(pid in R.punish)) { R.punish[pid] = {}; R.pforced[pid] = true; } });
    const recv = {}, given = {};
    Object.entries(R.punish).forEach(([from, m]) => {
      Object.entries(m).forEach(([to, k]) => {
        recv[to] = (recv[to] || 0) + k;
        given[from] = (given[from] || 0) + k;
      });
    });
    finishPGGRound(R, recv, given);
    S.pgg.phase = 'preveal';
    S.pgg.deadline = null;
    const last = S.pgg.round >= pggLimit() - 1;
    S.pgg.nextAt = set().autoNext && !S.paused && !last ? now() + set().pggNextDelay * 1000 : null;
  }
  function pggNext() {
    S.pgg.nextAt = null;
    if (S.pgg.round < pggLimit() - 1) {
      S.pgg.round++;
      pggStartRound();
    } else {
      S.pgg.phase = 'end';
    }
  }
  function pggIntroB() {
    S.pgg.part = 'B';
    S.pgg.round = 0;
    S.pgg.phase = 'introB';
    S.pgg.nextAt = null;
  }
  function pggStats() {
    const G = S.pgg;
    if (!G) return null;
    const done = G.rounds.filter((R) => R.pay);
    const E = set().pggEndow;
    const per = G.rounds.filter((R) => 'total' in R).map((R) => ({ part: R.part, idx: R.idx, avg: R.members.length ? R.total / R.members.length : 0, rate: R.members.length ? R.total / (R.members.length * (R.E || E)) : 0 }));
    let got = 0, lo = 0, hi = 0;
    done.forEach((R) => {
      got += sum(R.members.map((p) => R.pay[p]));
      lo += R.members.length * R.E;
      hi += R.members.length * R.E * R.m;
    });
    const gauge = hi > lo ? clamp((got - lo) / (hi - lo), 0, 1) : 0;
    const rateOf = (part) => {
      const xs = per.filter((x) => x.part === part);
      return xs.length ? avg(xs.map((x) => x.rate)) : null;
    };
    return { per, gauge, rateA: rateOf('A'), rateB: rateOf('B'), groupTotal: got };
  }

  /* ---------- 결과 요약 ---------- */
  function pdStats() {
    if (!S.pd) return null;
    const rate = (k) => {
      const part = S.pd.parts[k];
      if (!part || !part.coop.length) return null;
      return avg(part.coop.filter((x) => x !== undefined));
    };
    return {
      rate1: rate(1), rate2: rate(2),
      series1: S.pd.parts[1] ? S.pd.parts[1].coop.slice() : [],
      series2: S.pd.parts[2] ? S.pd.parts[2].coop.slice() : [],
    };
  }

  /* ---------- 진행 버튼 ---------- */
  function primary() {
    switch (S.stage) {
      case 'lobby':
        if (!activePids().length) return toast('한 명 이상 들어와야 시작할 수 있어요');
        startPD();
        break;
      case 'pd': {
        const ph = S.pd.phase;
        if (ph === 'intro') pdStartRound();
        else if (ph === 'choose') pdReveal();
        else if (ph === 'reveal') pdNext();
        else if (ph === 'end') { if (S.pd.cur === 1) setupPDPart(2); else startBots(); }
        break;
      }
      case 'bots': {
        const B = S.bots;
        if (B.phase === 'intro') botsPlay();
        else if (B.phase === 'play') B.phase = 'reveal';
        else if (B.phase === 'reveal') {
          const i = B.revealed.indexOf(false);
          if (i >= 0) B.revealed[i] = true;
          else B.phase = 'tourney';
        } else if (B.phase === 'tourney') B.phase = 'echo';
        else if (B.phase === 'echo') startPGG();
        break;
      }
      case 'pgg': {
        const G = S.pgg;
        if (G.phase === 'intro' || G.phase === 'introB') pggStartRound();
        else if (G.phase === 'contrib') pggRevealContrib();
        else if (G.phase === 'creveal') { if (G.part === 'B') pggStartPunish(); else pggNext(); }
        else if (G.phase === 'punish') pggRevealPunish();
        else if (G.phase === 'preveal') pggNext();
        else if (G.phase === 'end') { if (G.part === 'A') pggIntroB(); else { S.stage = 'final'; S.finalPhase = 'data'; } }
        else if (G.phase === 'surprise') { S.stage = 'final'; S.finalPhase = 'data'; }
        break;
      }
      case 'final':
        if (S.finalPhase !== 'surprise') S.finalPhase = 'surprise';
        else S.stage = 'lobby';
        break;
      default:
        break;
    }
    changed();
  }

  function primaryInfo() {
    const n = activePids().length;
    switch (S.stage) {
      case 'lobby':
        return { label: '대결 1 시작', disabled: !n, hint: n ? `${n}명 입장` : '아직 아무도 없어요' };
      case 'pd': {
        const part = pdPart();
        const ph = S.pd.phase;
        const tag = S.pd.cur === 1 ? '1차' : '2차';
        if (ph === 'intro') return { label: `${tag} 시작` };
        if (ph === 'choose') {
          const left = pdPending().length;
          return { label: '바로 공개', hint: left ? `${left}명 고민 중 · 안 고르면 협력으로 처리` : '' , soft: true };
        }
        if (ph === 'reveal') return { label: S.pd.round >= part.rounds - 1 ? `${tag} 마무리` : '다음 판' };
        if (ph === 'end') return { label: S.pd.cur === 1 ? '2차 준비' : '대결 2로' };
        break;
      }
      case 'bots': {
        const B = S.bots;
        if (B.phase === 'intro') return { label: '대결 2 시작' };
        if (B.phase === 'play') {
          const ids = activePids();
          const left = ids.filter((pid) => !(B.prog[pid] && B.prog[pid].guess)).length;
          return { label: '정체 공개로', hint: left ? `${left}명 아직 진행 중` : '모두 끝났어요', soft: left > 0 };
        }
        if (B.phase === 'reveal') {
          const i = B.revealed.indexOf(false);
          return { label: i >= 0 ? `알고리즘 ${ALGOS[i].no} 공개` : '토너먼트 돌려보기' };
        }
        if (B.phase === 'tourney') return { label: '실수가 끼면?' };
        if (B.phase === 'echo') return { label: '공공재 게임으로' };
        break;
      }
      case 'pgg': {
        const G = S.pgg;
        const last = G.round >= pggLimit() - 1;
        if (G.phase === 'intro') return { label: 'A단계 시작' };
        if (G.phase === 'introB') return { label: 'B단계 시작' };
        if (G.phase === 'contrib') {
          const left = pggPendingContrib().length;
          return { label: '바로 공개', hint: left ? `${left}명 고민 중 · 안 내면 0개로 처리` : '', soft: true };
        }
        if (G.phase === 'creveal') return { label: G.part === 'B' ? '응징 시간 👊' : last ? 'A단계 마무리' : '다음 판' };
        if (G.phase === 'punish') {
          const left = pggPendingPunish().length;
          return { label: '바로 공개', hint: left ? `${left}명 고민 중 · 안 고르면 응징 없음` : '', soft: true };
        }
        if (G.phase === 'preveal') return { label: last ? 'B단계 마무리' : '다음 판' };
        if (G.phase === 'end') return { label: G.part === 'A' ? 'B단계: 응징 등장 👊' : '오늘의 데이터' };
        if (G.phase === 'surprise') return { label: '오늘의 데이터' };
        break;
      }
      case 'final':
        return S.finalPhase === 'surprise' ? { label: '처음 화면으로', soft: true } : { label: '🎁 서프라이즈' };
      default:
        break;
    }
    return { label: '다음' };
  }

  function secondaryActions() {
    const acts = [];
    if (S.stage === 'bots' && ['reveal', 'tourney', 'echo'].includes(S.bots.phase)) acts.push({ label: '건너뛰고 공공재로', run: () => { startPGG(); changed(); } });
    if (S.stage === 'pd' && S.pd.phase === 'end' && S.pd.cur === 1) acts.push({ label: '2차 건너뛰기', run: () => { startBots(); changed(); } });
    return acts;
  }

  function goStage(stage) {
    S.paused = false;
    if (stage === 'lobby') S.stage = 'lobby';
    else if (stage === 'pd') startPD();
    else if (stage === 'bots') startBots();
    else if (stage === 'pgg') startPGG();
    else if (stage === 'final') { S.stage = 'final'; S.finalPhase = 'data'; }
    changed();
  }

  function togglePause() {
    S.paused = !S.paused;
    if (S.paused) {
      if (S.pd) S.pd.nextAt = null;
      if (S.pgg) S.pgg.nextAt = null;
    } else {
      if (S.stage === 'pd' && S.pd.phase === 'reveal' && set().autoNext && S.pd.round < pdPart().rounds - 1) S.pd.nextAt = now() + 2500;
      if (S.stage === 'pgg' && ['creveal', 'preveal'].includes(S.pgg.phase) && set().autoNext) {
        const lastA = S.pgg.part === 'A' && S.pgg.phase === 'creveal' && S.pgg.round >= pggLimit() - 1;
        const lastB = S.pgg.phase === 'preveal' && S.pgg.round >= pggLimit() - 1;
        if (!lastA && !lastB) S.pgg.nextAt = now() + 2500;
      }
    }
    changed();
  }

  function newGame() {
    const old = S ? S.order.slice() : [];
    const settings = S ? S.settings : null;
    S = freshState(settings);
    if (!passive) old.forEach((pid) => net.publish(T('v/' + pid), null, true));
    lastPub.clear();
    vq.length = 0;
    vqKeys.clear();
    resumePrompt = null;
    changed();
  }

  /* ---------- 학생 행동 처리 ---------- */
  function onAction(msg) {
    if (passive || !msg || msg.sid !== S.sid || !msg.pid || !msg.aid) return;
    if (processed.has(msg.aid)) { pushAck(msg.pid, msg.aid); scheduleFlush(); return; }
    processed.add(msg.aid);
    processedQ.push(msg.aid);
    if (processedQ.length > 3000) processed.delete(processedQ.shift());
    seen[msg.pid] = now();
    const { pid, type, d = {} } = msg;
    if (type !== 'join' && !P(pid)) return;
    switch (type) {
      case 'join': addPlayer(pid, d.name, d.avatar, false); break;
      case 'wave': if (P(pid)) P(pid).wave = (P(pid).wave || 0) + 1; break;
      case 'pd': pdChoose(pid, d.k, d.r, d.c); break;
      case 'bot': botChoose(pid, d.a, d.r, d.c); break;
      case 'guess': botGuess(pid, d.g); break;
      case 'contrib': pggContrib(pid, d.gr, d.n); break;
      case 'punish': pggPunish(pid, d.gr, d.alloc); break;
      default: break;
    }
    pushAck(pid, msg.aid);
    changed();
  }
  function pushAck(pid, aid) {
    const a = (acks[pid] = acks[pid] || []);
    if (!a.includes(aid)) a.push(aid);
    if (a.length > 12) a.shift();
  }

  /* ---------- 학생 화면에 보낼 내용 ---------- */
  function viewFor(pid) {
    const p = P(pid);
    const base = { sid: S.sid, me: { pid, name: p.name, avatar: p.avatar }, stage: S.stage, ack: (acks[pid] || []).slice() };
    if (p.kicked) return { ...base, screen: 'kicked' };
    if (S.stage === 'lobby') return { ...base, screen: 'lobby', n: activePids().length, wave: p.wave || 0 };
    if (S.stage === 'pd') return { ...base, ...pdView(pid) };
    if (S.stage === 'bots') return { ...base, ...botsView(pid) };
    if (S.stage === 'pgg') return { ...base, ...pggView(pid) };
    if (S.stage === 'final' && S.finalPhase === 'surprise') return { ...base, ...surpriseView(pid) };
    if (S.stage === 'final') return { ...base, ...finalView(pid) };
    return { ...base, screen: 'lobby', n: activePids().length };
  }
  function partnerInfo(part, pid, r, revealed) {
    const pair = part.schedule[r].find(([a, b]) => a === pid || b === pid);
    if (!pair) return { kind: 'none' };
    const other = pair[0] === pid ? pair[1] : pair[0];
    if (other === BOT) return part.named || revealed ? { kind: 'bot' } : { kind: 'anon' };
    if (part.named) return { kind: 'named', name: humanName(other), avatar: P(other) ? P(other).avatar : '🙂' };
    return { kind: 'anon' };
  }
  function pdHist(part, pid, upto) {
    const out = [];
    for (let r = 0; r < upto; r++) {
      const o = (part.outcomes[r] || []).find((x) => x.a === pid || x.b === pid);
      if (!o) continue;
      const mine = o.a === pid;
      out.push({ m: mine ? o.ca : o.cb, o: mine ? o.cb : o.ca, pay: mine ? o.pa : o.pb });
    }
    return out;
  }
  function pdView(pid) {
    const part = pdPart();
    const r = S.pd.round;
    const ph = S.pd.phase;
    const common = { k: S.pd.cur, rounds: part.rounds, round: r, mode: part.mode, named: part.named, score: part.scores[pid] || 0 };
    if (!part.members.includes(pid)) return { screen: 'wait', msg: '이번 대결은 이미 시작됐어요. 다음 순서부터 같이 해요.' };
    if (ph === 'intro') return { screen: 'pd_intro', ...common };
    if (ph === 'choose') {
      return { screen: 'pd_choose', ...common, partner: partnerInfo(part, pid, r, false), mine: part.choices[r][pid] || null, deadline: S.pd.deadline, hist: pdHist(part, pid, r) };
    }
    if (ph === 'reveal') {
      const o = part.outcomes[r].find((x) => x.a === pid || x.b === pid);
      const mineA = o.a === pid;
      return {
        screen: 'pd_reveal', ...common,
        partner: partnerInfo(part, pid, r, true),
        mine: mineA ? o.ca : o.cb, theirs: mineA ? o.cb : o.ca, pay: mineA ? o.pa : o.pb,
        forced: !!part.forced[r][pid], last: r >= part.rounds - 1, hist: pdHist(part, pid, r + 1),
      };
    }
    const hist = pdHist(part, pid, part.rounds);
    return { screen: 'pd_end', ...common, hist, coopN: hist.filter((h) => h.m === 'C').length };
  }
  function botsView(pid) {
    const B = S.bots;
    if (B.phase === 'intro') return { screen: 'bots_intro', rounds: B.rounds };
    const p = B.prog[pid];
    if (!p) return { screen: 'wait', msg: '대결 2 정체 공개 중이에요. 앞 화면을 봐 주세요.' };
    if (B.phase === 'play') {
      if (p.a < 3) return { screen: 'bots_play', a: p.a, rounds: B.rounds, hist: p.hist[p.a], score: p.score.slice(), prev: p.a > 0 ? p.hist[p.a - 1] : null };
      if (!p.guess) return { screen: 'bots_guess', score: p.score.slice(), hists: p.hist };
      return { screen: 'bots_done', guess: p.guess, score: p.score.slice() };
    }
    return { screen: 'bots_reveal', phase: B.phase, revealed: B.revealed.slice(), guess: p.guess, score: p.score.slice(), played: p.hist.map((h) => h.length) };
  }
  function pggView(pid) {
    const G = S.pgg;
    const ai = G.alias[pid];
    if (ai === undefined) return { screen: 'wait', msg: '다음 판부터 같이 해요.' };
    const s = set();
    const common = { alias: ANIMALS[ai], part: G.part, round: G.round, rounds: pggLimit(), E: s.pggEndow, m: s.pggMult, impact: s.pggImpact, maxP: s.pggMaxPunish, total: G.totals[pid] || 0 };
    if (G.phase === 'intro' || G.phase === 'introB') return { screen: 'pgg_intro', ...common };
    if (G.phase === 'end') return { screen: 'pgg_end', ...common };
    if (G.phase === 'surprise') {
      const st = pggStats();
      return { screen: 'pgg_surprise', ...common, gauge: st.gauge, target: s.jellyTarget / 100 };
    }
    const R = pggRound();
    if (!R || !R.members.includes(pid)) return { screen: 'wait', msg: '다음 판부터 같이 해요.' };
    const gr = G.rounds.length - 1;
    const rows = R.members.map((p) => ({ a: G.alias[p], c: p in R.contrib ? R.contrib[p] : null, me: p === pid }));
    if (G.phase === 'contrib') {
      return { screen: 'pgg_contrib', ...common, gr, mine: pid in R.contrib ? R.contrib[pid] : null, deadline: S.pgg.deadline, n: R.members.length, done: R.members.length - pggPendingContrib().length };
    }
    if (G.phase === 'creveal') {
      return { screen: 'pgg_creveal', ...common, gr, mine: R.contrib[pid], sumC: R.total, pot: R.pot, share: R.share, base: R.base[pid], rows, pay: R.pay ? R.pay[pid] : null, n: R.members.length };
    }
    if (G.phase === 'punish') {
      const mine = R.punish[pid];
      const mineByAlias = mine ? Object.fromEntries(Object.entries(mine).map(([t, k]) => [G.alias[t], k])) : null;
      return { screen: 'pgg_punish', ...common, gr, rows: rows.filter((x) => !x.me), myC: R.contrib[pid], mine: mineByAlias, deadline: S.pgg.deadline };
    }
    if (G.phase === 'preveal') {
      return {
        screen: 'pgg_preveal', ...common, gr, base: R.base[pid], recv: R.recv[pid] || 0, given: R.given[pid] || 0, pay: R.pay[pid],
        rows: R.members.map((p) => ({ a: G.alias[p], c: R.contrib[p], hits: R.recv[p] || 0, me: p === pid })),
      };
    }
    return { screen: 'wait', msg: '앞 화면을 봐 주세요' };
  }
  function surpriseView(pid) {
    const st = S.pgg ? pggStats() : null;
    return { screen: 'surprise', gauge: st ? st.gauge : null, target: set().jellyTarget / 100, total: S.pgg && S.pgg.totals[pid] !== undefined ? S.pgg.totals[pid] : null };
  }
  function finalView(pid) {
    const out = { screen: 'final' };
    if (S.pd) {
      out.pd = [1, 2].map((k) => (S.pd.parts[k] && S.pd.parts[k].scores[pid] !== undefined ? S.pd.parts[k].scores[pid] : null));
    }
    if (S.bots && S.bots.prog[pid]) {
      const p = S.bots.prog[pid];
      out.bots = { score: p.score.slice(), correct: p.guess ? p.guess.filter((g, i) => g === ALGOS[i].key).length : null };
    }
    if (S.pgg && S.pgg.totals[pid] !== undefined) out.pgg = S.pgg.totals[pid];
    return out;
  }

  /* ---------- 전송 ---------- */
  let flushTimer = null;
  function scheduleFlush() {
    if (flushTimer) return;
    if (document.hidden) { flush(); return; }
    flushTimer = setTimeout(() => { flushTimer = null; flush(); }, 40);
  }
  function sendIfChanged(topic, body) {
    const key = JSON.stringify(body);
    if (lastPub.get(topic) === key) return;
    lastPub.set(topic, key);
    S.seq++;
    net.publish(topic, { ...body, ver: S.seq, now: now() }, true);
  }
  function flush() {
    if (flushTimer) { clearTimeout(flushTimer); flushTimer = null; }
    if (!S || !ready || passive) { persist(); return; }
    sendIfChanged(T('pub'), { sid: S.sid, stage: S.stage, n: activePids().length });
    S.order.forEach((pid) => sendIfChanged(T('v/' + pid), viewFor(pid)));
    persist();
  }

  /* ---------- 가상 참가자 (리허설용) ---------- */
  function vSchedule(key, delay, fn) {
    if (vqKeys.has(key)) return;
    vqKeys.add(key);
    vq.push({ due: now() + delay, fn, key });
  }
  const rnd = (a, b) => a + Math.random() * (b - a);
  function scheduleVirtual() {
    if (!S) return;
    const vids = activePids().filter((pid) => P(pid).virtual);
    if (!vids.length) return;
    const act = (pid, type, d) => () => onAction({ sid: S.sid, pid, aid: 'v' + uid(10), type, d });
    vids.forEach((pid) => {
      if (S.stage === 'pd' && S.pd.phase === 'choose') {
        const part = pdPart();
        if (part.members.includes(pid) && !(pid in part.choices[S.pd.round])) {
          vSchedule(`${S.sid}:pd:${S.pd.cur}:${S.pd.round}:${pid}`, rnd(700, 3500), act(pid, 'pd', { k: S.pd.cur, r: S.pd.round, c: Math.random() < (S.pd.cur === 2 ? 0.75 : 0.55) ? 'C' : 'D' }));
        }
      }
      if (S.stage === 'bots' && S.bots.phase === 'play') {
        const p = S.bots.prog[pid];
        if (p && p.a < 3) {
          const a = p.a, r = p.hist[a].length;
          const last = r ? p.hist[a][r - 1].b : 'C';
          vSchedule(`${S.sid}:bot:${a}:${r}:${pid}`, rnd(500, 1500), act(pid, 'bot', { a, r, c: Math.random() < 0.7 ? last : (Math.random() < 0.5 ? 'C' : 'D') }));
        } else if (p && !p.guess) {
          vSchedule(`${S.sid}:guess:${pid}`, rnd(800, 2500), act(pid, 'guess', { g: ALGOS.map((al) => (Math.random() < 0.75 ? al.key : GUESS_OPTS[Math.floor(Math.random() * 4)].key)) }));
        }
      }
      if (S.stage === 'pgg' && S.pgg.phase === 'contrib') {
        const R = pggRound(), gr = S.pgg.rounds.length - 1;
        if (R.members.includes(pid) && !(pid in R.contrib)) {
          const base = R.part === 'B' ? 6 : Math.max(1, 7 - S.pgg.round * 2);
          vSchedule(`${S.sid}:c:${gr}:${pid}`, rnd(900, 4000), act(pid, 'contrib', { gr, n: clamp(Math.round(base + rnd(-3, 3)), 0, set().pggEndow) }));
        }
      }
      if (S.stage === 'pgg' && S.pgg.phase === 'punish') {
        const R = pggRound(), gr = S.pgg.rounds.length - 1;
        if (R.members.includes(pid) && !(pid in R.punish)) {
          const alloc = {};
          const others = R.members.filter((p) => p !== pid);
          const low = others.sort((x, y) => R.contrib[x] - R.contrib[y])[0];
          if (low && R.contrib[low] < 4 && Math.random() < 0.6) alloc[S.pgg.alias[low]] = 1 + Math.floor(Math.random() * 2);
          vSchedule(`${S.sid}:p:${gr}:${pid}`, rnd(900, 3500), act(pid, 'punish', { gr, alloc }));
        }
      }
    });
  }

  /* ---------- 시계 ---------- */
  function tick() {
    if (!S) return;
    const t = now();
    for (let i = vq.length - 1; i >= 0; i--) {
      if (vq[i].due <= t) {
        const item = vq.splice(i, 1)[0];
        try { item.fn(); } catch (e) { console.error(e); }
      }
    }
    if (!S.paused) {
      if (S.stage === 'pd' && S.pd && S.pd.phase === 'reveal' && S.pd.nextAt && t >= S.pd.nextAt) { S.pd.nextAt = null; primary(); }
      if (S.stage === 'pgg' && S.pgg && ['creveal', 'preveal'].includes(S.pgg.phase) && S.pgg.nextAt && t >= S.pgg.nextAt) { S.pgg.nextAt = null; primary(); }
    }
  }

  /* ---------- CSV ---------- */
  function csv() {
    const cols = ['t', 'stage', 'part', 'round', 'player', 'choice', 'other', 'otherChoice', 'payoff', 'forced'];
    const head = ['시각', '단계', '구분', '라운드', '참가자', '선택', '상대', '상대 선택', '점수', '자동처리'];
    const esc = (v) => {
      const s = v === undefined || v === null ? '' : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    return '﻿' + [head.join(','), ...S.log.map((row) => cols.map((c) => esc(row[c])).join(','))].join('\n');
  }

  /* ---------- 진행자 화면 중복 처리 ---------- */
  function myHb() { return { sid: S.sid, inst, claim: S.claim || 0, n: activePids().length, createdAt: S.createdAt, now: now() }; }
  function strengthOf(x) { return [x.claim || 0, x.n || 0, -(x.createdAt || 0), String(x.inst || '')]; }
  function cmpStrength(a, b) {
    for (let i = 0; i < a.length; i++) { if (a[i] > b[i]) return 1; if (a[i] < b[i]) return -1; }
    return 0;
  }
  function takeover() {
    S.claim = now();
    passive = false;
    ready = true;
    lastPub.clear();
    changed();
    flush();
    net.publish(T('hb'), myHb(), false);
  }

  /* ---------- 시작 ---------- */
  function boot() {
    const saved = loadSaved();
    if (saved && (saved.order.length || saved.stage !== 'lobby')) {
      S = saved;
      resumePrompt = { at: saved.createdAt, stage: saved.stage, n: saved.order.length };
    } else {
      S = saved || freshState();
    }
    net.subscribe(T('act'), onAction);
    // 진행자 화면이 둘이면: 직접 넘겨받은 화면 > 참가자가 많은 화면 > 먼저 시작한 화면 순으로 진행권을 갖는다
    net.subscribe(T('hb'), (m, meta) => {
      if (!m || !S || meta.retained || !m.inst || m.inst === inst) return;
      const c = cmpStrength(strengthOf(m), strengthOf(myHb()));
      if (c > 0) {
        if (!passive) { passive = true; notify(); }
      } else if (!passive && ready && now() - lastAssert > 3000) {
        lastAssert = now();
        lastPub.clear();
        flush();
        net.publish(T('hb'), myHb(), false);
        if (!ui.warnedAt || now() - ui.warnedAt > 15000) {
          ui.warnedAt = now();
          toast('⚠️ 다른 진행자 화면이 열려 있어요. 여기서 계속 진행해요.');
        }
      }
    });
    net.subscribe(T('ph'), (m) => {
      if (m && m.sid === S.sid && m.pid && S.players[m.pid]) { seen[m.pid] = now(); }
    });
    net.onReconnect(() => { lastPub.clear(); flush(); });
    // 화면이 가려져도 늦지 않게 워커 타이머로 신호를 보낸다
    workerInterval(() => { if (S && ready && !passive) net.publish(T('hb'), myHb(), false); }, 4000);
    workerInterval(tick, 300);
    setTimeout(() => { ready = true; lastPub.clear(); flush(); if (!passive) net.publish(T('hb'), myHb(), false); notify(); }, 5000);
    setInterval(notify, 2000); // 접속 상태 표시 갱신
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastPub.clear(); flush(); } });
    changed();
  }

  return {
    boot,
    get S() { return S; },
    get ui() { return ui; },
    get resumePrompt() { return resumePrompt; },
    get passive() { return passive; },
    get ready() { return ready; },
    takeover,
    params,
    listen(f) { listeners.add(f); return () => listeners.delete(f); },
    setUI(patch) { ui = { ...ui, ...patch }; notify(); },
    resume() { resumePrompt = null; S.paused = false; changed(); },
    newGame,
    primary,
    primaryInfo,
    secondaryActions,
    goStage,
    togglePause,
    kick: (pid) => kick(pid),
    addVirtual,
    setSetting(k, v) { S.settings[k] = v; changed(); },
    online(pid) { const p = P(pid); return p && (p.virtual || now() - (seen[pid] || 0) < 25000); },
    activePids,
    pdPart: () => (S.pd ? pdPart() : null),
    pdPending: () => (S.pd && S.pd.phase === 'choose' ? pdPending() : []),
    pggRound: () => (S.pgg ? pggRound() : null),
    pggPendingContrib: () => (S.pgg && S.pgg.phase === 'contrib' ? pggPendingContrib() : []),
    pggPendingPunish: () => (S.pgg && S.pgg.phase === 'punish' ? pggPendingPunish() : []),
    pggLimit: () => (S.pgg ? pggLimit() : 0),
    botStats,
    pggStats,
    pdStats,
    csv,
    humanName,
    toast,
  };
}

/* ---- player.js ---- */
/* =====================================================================
 * 학생(플레이어) — 진행자가 보내 준 화면 내용을 그대로 그리고, 고른 것만 보낸다
 * ===================================================================== */
function createPlayer(params, net) {
  const T = (name) => `${params.base}/${name}`;
  const store = params.local ? sessionStorage : localStorage;
  const K = (k) => `tg:${params.room}:${k}`;
  const get = (k) => { try { return store.getItem(K(k)); } catch (e) { return null; } };
  const put = (k, v) => { try { store.setItem(K(k), v); } catch (e) {} };

  let pid = get('pid');
  if (!pid) { pid = 'p_' + uid(10); put('pid', pid); }
  let name = get('name') || '';
  const listeners = new Set();
  let pub = null;
  let view = null;
  let lastFresh = 0;
  let skew = 0;
  let pending = [];
  let joinedSid = null;
  let bootAt = now();
  let netUp = 0;

  const notify = () => listeners.forEach((f) => f());
  const fresh = (m, meta) => {
    if (meta && meta.retained) return;
    lastFresh = now();
    if (m && typeof m.now === 'number') skew = m.now - now();
  };

  function send(type, d) {
    const sid = (pub && pub.sid) || (view && view.sid);
    if (!sid) return null;
    const a = { aid: uid(12), type, d, sid, sentAt: now(), tries: 1 };
    pending.push(a);
    net.publish(T('act'), { sid, pid, aid: a.aid, type, d }, false);
    notify();
    return a.aid;
  }
  function resend() {
    const t = now();
    const sid = pub && pub.sid;
    pending = pending.filter((a) => a.tries < 15 && (!sid || a.sid === sid));
    pending.forEach((a) => {
      if (t - a.sentAt > 2000) {
        a.tries++;
        a.sentAt = t;
        net.publish(T('act'), { sid: a.sid, pid, aid: a.aid, type: a.type, d: a.d }, false);
      }
    });
  }

  function maybeAutoJoin() {
    if (!pub || !name) return;
    if (view && view.sid === pub.sid) return;
    if (joinedSid === pub.sid) return;
    joinedSid = pub.sid;
    send('join', { name });
  }

  net.subscribe(T('pub'), (m, meta) => {
    if (!m || !m.sid) return;
    if (pub && pub.sid === m.sid && m.ver <= pub.ver) { fresh(m, meta); return; }
    pub = m;
    fresh(m, meta);
    if (view && view.sid !== m.sid) view = null;
    maybeAutoJoin();
    notify();
  });
  net.subscribe(T('v/' + pid), (m, meta) => {
    if (!m || !m.sid) return;
    if (pub && m.sid !== pub.sid) return;
    fresh(m, meta);
    if (view && view.sid === m.sid && m.ver <= view.ver) return;
    view = m;
    if (Array.isArray(m.ack)) pending = pending.filter((a) => !m.ack.includes(a.aid));
    notify();
  });
  net.subscribe(T('hb'), (m, meta) => {
    if (!m || !m.sid) return;
    if (pub && m.sid !== pub.sid) return;
    const wasAlive = hostAlive();
    fresh(m, meta);
    if (!wasAlive) notify();
  });
  net.onStatus((st) => {
    netUp = Object.values(st).filter((x) => x === 'up').length;
    notify();
  });
  net.onReconnect(() => { resend(); });

  // 진행자 화면이 늦게 열리거나 새로고침돼서 입장 신호를 놓친 경우 다시 보낸다
  setInterval(() => {
    resend();
    if (!pub || !name) return;
    const live = view && view.sid === pub.sid;
    if (!live && !pending.some((a) => a.type === 'join')) send('join', { name });
  }, 1200);
  setInterval(() => {
    const sid = (pub && pub.sid) || (view && view.sid);
    if (sid) net.publish(T('ph'), { sid, pid, t: now() }, false);
  }, 8000);
  setInterval(() => notify(), 3000);

  function hostAlive() { return now() - lastFresh < 13000; }

  return {
    pid,
    get name() { return name; },
    get view() { return view; },
    get pub() { return pub; },
    get pending() { return pending; },
    get netUp() { return netUp; },
    hostAlive,
    sinceBoot: () => now() - bootAt,
    hostNow: () => now() + skew,
    listen(f) { listeners.add(f); return () => listeners.delete(f); },
    rename(n) {
      const nn = String(n || '').replace(/\s+/g, ' ').trim().slice(0, 10);
      if (!nn) return;
      name = nn;
      put('name', name);
      send('join', { name });
    },
    join(n) {
      name = String(n || '').replace(/\s+/g, ' ').trim().slice(0, 10);
      if (!name) return;
      put('name', name);
      joinedSid = pub ? pub.sid : null;
      send('join', { name });
    },
    send,
  };
}
